<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhimFlix • Xem Phim HD Online</title>

    <!-- Font chữ -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#e50914',
                            dark: '#b90910',
                            light: '#ff1a25'
                        }
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                        'fade-in': 'fadeIn 0.5s ease-out'
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }
    </script>

    <!-- Swiper CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />

    <!-- Hls.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e50914;
        }

        .swiper-pagination-bullet {
            background: #94a3b8;
            opacity: 0.5;
        }
        .swiper-pagination-bullet-active {
            background: #e50914;
            opacity: 1;
        }

        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand selection:text-white">

<!-- ===== HEADER ===== -->
<header class="sticky top-0 z-50 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/70 shadow-lg shadow-black/5">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-4">

        <!-- Logo -->
        <a href="#/" class="flex items-center gap-2 text-2xl font-black tracking-tight text-brand shrink-0">
            <i data-lucide="clapperboard" class="w-7 h-7"></i>
            <span>PHIM<span class="text-white">FLIX</span></span>
        </a>

        <!-- Desktop Nav -->
        <nav class="hidden md:flex items-center gap-5 text-sm font-medium text-slate-300">
            <a href="#/" class="hover:text-brand transition">Trang Chủ</a>
            <a href="#/danh-sach/phim-bo" class="hover:text-brand transition">Phim Bộ</a>
            <a href="#/danh-sach/phim-le" class="hover:text-brand transition">Phim Lẻ</a>
            <a href="#/danh-sach/phim-chieu-rap" class="hover:text-brand transition">Phim Chiếu Rạp</a>
            <a href="#/danh-sach/hoat-hinh" class="hover:text-brand transition">Hoạt Hình</a>

            <!-- Dropdown Thể Loại -->
            <div class="relative group py-4">
                <button class="flex items-center gap-1 hover:text-brand transition">
                    Thể Loại <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
                <div class="absolute top-full left-0 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 grid grid-cols-3 gap-1 w-80 p-3 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl shadow-2xl max-h-80 overflow-y-auto" id="dropdown-theloai">
                    <span class="col-span-3 text-xs text-slate-500 text-center py-2">Đang tải...</span>
                </div>
            </div>

            <!-- Dropdown Quốc Gia -->
            <div class="relative group py-4">
                <button class="flex items-center gap-1 hover:text-brand transition">
                    Quốc Gia <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
                <div class="absolute top-full left-0 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 grid grid-cols-2 gap-1 w-64 p-3 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl shadow-2xl max-h-80 overflow-y-auto" id="dropdown-quocgia">
                    <span class="col-span-2 text-xs text-slate-500 text-center py-2">Đang tải...</span>
                </div>
            </div>

            <!-- Dropdown Năm -->
            <div class="relative group py-4">
                <button class="flex items-center gap-1 hover:text-brand transition">
                    Năm <i data-lucide="chevron-down" class="w-4 h-4"></i>
                </button>
                <div class="absolute top-full left-0 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200 grid grid-cols-3 gap-1 w-60 p-3 bg-slate-900/95 backdrop-blur-md border border-slate-800 rounded-xl shadow-2xl max-h-72 overflow-y-auto" id="dropdown-nam">
                    <span class="col-span-3 text-xs text-slate-500 text-center py-2">Đang tải...</span>
                </div>
            </div>

            <!-- Lịch sử xem -->
            <a href="#/lich-su" class="hover:text-brand transition flex items-center gap-1.5 text-amber-400 font-semibold">
                <i data-lucide="history" class="w-4 h-4"></i> Lịch Sử
            </a>
        </nav>

        <!-- Search + Mobile Toggle -->
        <div class="flex items-center gap-3 flex-1 md:flex-none justify-end">
            <form id="search-form" class="relative flex-1 max-w-xs hidden sm:block">
                <input type="text" id="search-input" placeholder="Tìm phim..."
                       class="w-full bg-slate-900/80 text-sm text-slate-200 pl-9 pr-4 py-2 rounded-full border border-slate-700/60 focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand/30 transition placeholder:text-slate-500">
                <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-slate-400"></i>
            </form>

            <button id="mobile-menu-btn" class="md:hidden text-slate-300 hover:text-white transition">
                <i data-lucide="menu" class="w-6 h-6"></i>
            </button>
        </div>
    </div>

    <!-- Mobile Menu Panel -->
    <div id="mobile-menu" class="md:hidden hidden bg-slate-900/95 backdrop-blur-xl border-t border-slate-800 px-4 py-4 space-y-3 max-h-[80vh] overflow-y-auto animate-fade-in">
        <a href="#/" class="block py-2 text-sm font-medium hover:text-brand">Trang Chủ</a>
        <a href="#/lich-su" class="block py-2 text-sm font-semibold text-amber-400 hover:text-amber-300 flex items-center gap-2">
            <i data-lucide="history" class="w-4 h-4"></i> Lịch Sử Xem Phim
        </a>
        <a href="#/danh-sach/phim-bo" class="block py-2 text-sm font-medium hover:text-brand">Phim Bộ</a>
        <a href="#/danh-sach/phim-le" class="block py-2 text-sm font-medium hover:text-brand">Phim Lẻ</a>
        <a href="#/danh-sach/phim-chieu-rap" class="block py-2 text-sm font-medium hover:text-brand">Phim Chiếu Rạp</a>
        <a href="#/danh-sach/hoat-hinh" class="block py-2 text-sm font-medium hover:text-brand">Hoạt Hình</a>
        
        <div class="pt-2 border-t border-slate-800 text-xs font-medium text-slate-400 uppercase tracking-wider">Thể Loại</div>
        <div id="mobile-theloai" class="grid grid-cols-2 gap-1"></div>
        
        <div class="pt-2 border-t border-slate-800 text-xs font-medium text-slate-400 uppercase tracking-wider">Quốc Gia</div>
        <div id="mobile-quocgia" class="grid grid-cols-2 gap-1"></div>

        <div class="pt-2 border-t border-slate-800 text-xs font-medium text-slate-400 uppercase tracking-wider">Năm Phát Hành</div>
        <div id="mobile-nam" class="grid grid-cols-3 gap-1"></div>

        <form id="search-form-mobile" class="pt-2">
            <input type="text" id="search-input-mobile" placeholder="Tìm phim..."
                   class="w-full bg-slate-800 text-sm text-slate-200 px-4 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:border-brand">
        </form>
    </div>
</header>

<!-- ===== MAIN CONTENT ===== -->
<main id="app-content" class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 animate-fade-in">
</main>

<!-- ===== FOOTER ===== -->
<footer class="border-t border-slate-900 bg-slate-950 py-8 text-center text-xs text-slate-500">
    <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-2">
        <p>© 2026 PhimFlix · Xem phim trực tuyến miễn phí</p>
        <p class="flex items-center gap-1">Hosted on <span class="text-slate-400">GitHub Pages</span> <i data-lucide="github" class="w-3.5 h-3.5"></i></p>
    </div>
</footer>

<button id="back-to-top" class="fixed bottom-6 right-6 z-40 p-3 bg-brand hover:bg-brand-dark text-white rounded-full shadow-lg shadow-brand/30 transition opacity-0 invisible translate-y-2 duration-300" title="Lên đầu trang">
    <i data-lucide="arrow-up" class="w-5 h-5"></i>
</button>

<!-- ===== SCRIPTS ===== -->
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    (function() {
        const API_BASE = 'https://phimapi.com';
        const IMG_DOMAIN = 'https://phimimg.com';
        const HISTORY_KEY = 'phimflix_history_v1';

        let currentHls = null;
        let categoriesCache = [];
        let countriesCache = [];
        let yearsCache = [];
        let homeSwiper = null;
        let cachedMovieData = null;

        // Đăng ký Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(reg => console.log('Service Worker đã sẵn sàng:', reg.scope))
                    .catch(err => console.error('Lỗi đăng ký Service Worker:', err));
            });
        }

        // --- HÀM XỬ LÝ LỊCH SỬ XEM PHIM ---
        function getWatchHistory() {
            try {
                return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};
            } catch (e) {
                return {};
            }
        }

        function saveWatchProgress(movieInfo) {
            if (!movieInfo || !movieInfo.slug) return;
            const history = getWatchHistory();
            history[movieInfo.slug] = {
                slug: movieInfo.slug,
                name: movieInfo.name,
                origin_name: movieInfo.origin_name || '',
                poster_url: movieInfo.poster_url || '',
                thumb_url: movieInfo.thumb_url || '',
                ep_slug: movieInfo.ep_slug,
                ep_name: movieInfo.ep_name,
                server_idx: movieInfo.server_idx,
                server_name: movieInfo.server_name,
                currentTime: movieInfo.currentTime || 0,
                duration: movieInfo.duration || 0,
                updatedAt: Date.now()
            };
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) { console.error('Lỗi lưu lịch sử:', e); }
        }

        function removeHistoryItem(slug) {
            const history = getWatchHistory();
            delete history[slug];
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        function clearAllHistory() {
            localStorage.removeItem(HISTORY_KEY);
        }

        function formatTime(seconds) {
            if (!seconds || isNaN(seconds) || seconds < 0) return '00:00';
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- Helpers ---
        const getImageUrl = (path) => {
            if (!path) return 'https://via.placeholder.com/300x450?text=No+Cover';
            if (path.startsWith('http')) return path;
            return `${IMG_DOMAIN}/${path.replace(/^\//, '')}`;
        };

        const parseHash = () => {
            const hash = window.location.hash.slice(1) || '/';
            const [pathAndQuery, queryString] = hash.split('?');
            const parts = pathAndQuery.split('/').filter(Boolean);
            const params = new URLSearchParams(queryString || '');
            return {
                route: parts[0] || 'home',
                subRoute: parts[1] || '',
                param: parts[2] || '',
                queryParams: Object.fromEntries(params.entries())
            };
        };

        const extractArray = (res) => {
            if (!res) return [];
            if (Array.isArray(res)) return res;
            if (Array.isArray(res.data)) return res.data;
            if (Array.isArray(res.data?.items)) return res.data.items;
            if (Array.isArray(res.items)) return res.items;
            return [];
        };

        function closeMobileMenu() {
            const mobileMenu = document.getElementById('mobile-menu');
            const menuBtnIcon = document.getElementById('mobile-menu-btn')?.querySelector('i');
            if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                mobileMenu.classList.add('hidden');
                if (menuBtnIcon) {
                    menuBtnIcon.setAttribute('data-lucide', 'menu');
                    lucide.createIcons();
                }
            }
        }

        function showSkeleton() {
            document.getElementById('app-content').innerHTML = `
                <div class="space-y-8 animate-pulse">
                    <div class="skeleton h-64 md:h-96 rounded-2xl"></div>
                    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4 md:gap-6">
                        ${Array(10).fill('<div class="aspect-[2/3] skeleton rounded-xl"></div>').join('')}
                    </div>
                </div>
            `;
        }

        function renderPagination(pagination, hashPrefix) {
            if (!pagination || pagination.totalPages <= 1) return '';
            const current = pagination.currentPage;
            const total = pagination.totalPages;
            let html = '<div class="flex items-center justify-center gap-3 mt-10">';
            if (current > 1) {
                html += `<a href="${hashPrefix}page=${current-1}" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-sm font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> Trước</a>`;
            }
            html += `<span class="px-4 py-2 bg-slate-900 border border-slate-800 text-sm rounded-lg text-slate-400">Trang <strong class="text-white">${current}</strong> / ${total}</span>`;
            if (current < total) {
                html += `<a href="${hashPrefix}page=${current+1}" class="px-4 py-2 bg-brand hover:bg-brand-dark text-sm font-semibold rounded-lg transition flex items-center gap-1">Sau <i data-lucide="chevron-right" class="w-4 h-4"></i></a>`;
            }
            html += '</div>';
            return html;
        }

        function renderMovieCard(movie) {
            const title = movie.name || '';
            const origin = movie.origin_name || '';
            const year = movie.year || '';
            const quality = movie.quality || movie.episode_current || 'HD';
            const poster = getImageUrl(movie.poster_url || movie.thumb_url);
            const slug = movie.slug;

            return `
            <a href="#/phim/${slug}" class="group relative flex flex-col bg-slate-900/80 backdrop-blur-sm rounded-2xl overflow-hidden border border-slate-800/60 hover:border-brand/40 transition-all duration-300 hover:-translate-y-2 hover:shadow-2xl hover:shadow-brand/10">
                <div class="aspect-[2/3] w-full overflow-hidden bg-slate-800 relative">
                    <img src="${poster}" alt="${title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700 ease-out">
                    <div class="absolute inset-0 bg-gradient-to-t from-slate-950/90 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-center pb-4">
                        <span class="bg-brand/90 text-white text-xs font-bold px-3 py-1.5 rounded-full backdrop-blur-sm flex items-center gap-1"><i data-lucide="play" class="w-3.5 h-3.5 fill-white"></i> Xem ngay</span>
                    </div>
                    <span class="absolute top-3 left-3 px-2.5 py-1 bg-brand text-[10px] font-bold text-white rounded-md shadow-md z-10">${quality}</span>
                </div>
                <div class="p-3 flex flex-col flex-1">
                    <h3 class="font-bold text-sm text-slate-100 line-clamp-1 group-hover:text-brand transition-colors">${title}</h3>
                    <p class="text-xs text-slate-400 line-clamp-1 mt-1">${origin}</p>
                    ${year ? `<span class="text-[11px] text-slate-500 mt-auto pt-2 font-medium">📅 ${year}</span>` : ''}
                </div>
            </a>`;
        }

        // ========== NẠP MENUS DROPDOWN ==========
        async function loadHeaderMenus() {
            try {
                const [catRes, counRes, yearRes] = await Promise.all([
                    fetch(`${API_BASE}/the-loai`).then(r => r.json()).catch(() => []),
                    fetch(`${API_BASE}/quoc-gia`).then(r => r.json()).catch(() => []),
                    fetch(`${API_BASE}/nam-phat-hanh`).then(r => r.json()).catch(() => [])
                ]);

                categoriesCache = extractArray(catRes);
                countriesCache = extractArray(counRes);
                yearsCache = extractArray(yearRes);

                // 1. Thể Loại
                if (categoriesCache.length > 0) {
                    const html = categoriesCache.map(c => {
                        const name = typeof c === 'object' ? (c.name || c.title || '') : c;
                        const slug = typeof c === 'object' ? (c.slug || c.name || '') : c;
                        if (!name) return '';
                        return `<a href="#/the-loai/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors">${name}</a>`;
                    }).filter(Boolean).join('');
                    document.getElementById('dropdown-theloai').innerHTML = html;
                    document.getElementById('mobile-theloai').innerHTML = html;
                }

                // 2. Quốc Gia
                if (countriesCache.length > 0) {
                    const html = countriesCache.map(c => {
                        const name = typeof c === 'object' ? (c.name || c.title || '') : c;
                        const slug = typeof c === 'object' ? (c.slug || c.name || '') : c;
                        if (!name) return '';
                        return `<a href="#/quoc-gia/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors">${name}</a>`;
                    }).filter(Boolean).join('');
                    document.getElementById('dropdown-quocgia').innerHTML = html;
                    document.getElementById('mobile-quocgia').innerHTML = html;
                }

                // 3. Năm Phát Hành
                if (yearsCache.length > 0) {
                    const html = yearsCache.map(y => {
                        let name = typeof y === 'object' ? (y.name || y.year || y.slug || '') : y;
                        let slug = typeof y === 'object' ? (y.slug || y.name || y.year || '') : y;
                        if (!name || name === 'undefined') return '';
                        return `<a href="#/nam/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors text-center">${name}</a>`;
                    }).filter(Boolean).join('');
                    document.getElementById('dropdown-nam').innerHTML = html;
                    document.getElementById('mobile-nam').innerHTML = html;
                }
            } catch (e) {
                console.error('Lỗi nạp menu:', e);
            }
        }

        // ========== VIEWS ==========
        async function viewHome() {
            showSkeleton();
            try {
                const res = await fetch(`${API_BASE}/v1/api/home`).then(r => r.json());
                const items = res?.data?.items || [];
                if (!items.length) {
                    document.getElementById('app-content').innerHTML = '<p class="text-center py-20 text-slate-400">Không có dữ liệu phim.</p>';
                    return;
                }

                const heroMovies = items.slice(0, 5);
                const heroSlides = heroMovies.map((m) => `
                    <div class="swiper-slide relative rounded-3xl overflow-hidden aspect-[16/9] md:aspect-[21/9] border border-slate-800 shadow-2xl">
                        <img src="${getImageUrl(m.thumb_url || m.poster_url)}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/50 to-transparent flex flex-col justify-end p-6 md:p-10">
                            <span class="text-brand font-bold uppercase tracking-widest text-xs mb-2 drop-shadow">🔥 Nổi bật</span>
                            <h1 class="text-2xl md:text-4xl font-extrabold text-white mb-2 line-clamp-1 drop-shadow-lg">${m.name}</h1>
                            <p class="text-sm text-slate-200 line-clamp-2 max-w-xl mb-4 drop-shadow">${m.origin_name || ''}</p>
                            <a href="#/phim/${m.slug}" class="inline-flex items-center gap-2 bg-brand hover:bg-brand-dark px-6 py-3 rounded-xl font-bold text-sm transition shadow-xl shadow-brand/20 w-fit">
                                <i data-lucide="play" class="w-4 h-4 fill-white"></i> Xem ngay
                            </a>
                        </div>
                    </div>
                `).join('');

                const html = `
                <div class="space-y-10">
                    <div class="swiper hero-swiper rounded-3xl overflow-hidden">
                        <div class="swiper-wrapper">${heroSlides}</div>
                        <div class="swiper-pagination !bottom-4"></div>
                    </div>

                    <div>
                        <div class="flex items-center justify-between mb-6">
                            <h2 class="text-xl md:text-2xl font-bold flex items-center gap-2">
                                <i data-lucide="sparkles" class="w-6 h-6 text-brand"></i> Phim Mới Cập Nhật
                            </h2>
                            <a href="#/danh-sach/phim-le" class="text-sm text-brand hover:underline font-medium flex items-center gap-1">Xem tất cả <i data-lucide="arrow-right" class="w-4 h-4"></i></a>
                        </div>
                        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-4 md:gap-5">
                            ${items.map(renderMovieCard).join('')}
                        </div>
                    </div>
                </div>`;

                document.getElementById('app-content').innerHTML = html;
                lucide.createIcons();

                if (homeSwiper) homeSwiper.destroy();
                homeSwiper = new Swiper('.hero-swiper', {
                    loop: true,
                    autoplay: { delay: 5000, disableOnInteraction: false },
                    pagination: { el: '.swiper-pagination', clickable: true },
                    effect: 'fade',
                    fadeEffect: { crossFade: true },
                    speed: 800
                });

            } catch (err) {
                document.getElementById('app-content').innerHTML = '<p class="text-center py-20 text-red-400">⚠️ Lỗi tải trang chủ.</p>';
            }
        }

        async function viewCatalog(endpointUrl, fallbackTitle, hashPrefix) {
            showSkeleton();
            try {
                const res = await fetch(endpointUrl).then(r => r.json());
                const data = res?.data || res;
                const items = data.items || [];
                const pagination = data.params?.pagination || data.pagination;
                const title = data.titlePage || res?.titlePage || fallbackTitle;

                const html = `
                <div class="space-y-6 animate-fade-in">
                    <div class="flex items-center gap-3">

        // HLS Player qua Proxy + Tự động lưu tiến trình Lịch Sử
        function initHlsPlayer(url, startTime = 0, movieMeta = null) {
            const video = document.getElementById('hls-player');
            if (!video) return;

            const proxiedUrl = `/proxy-stream?url=${encodeURIComponent(url)}`;
            if (currentHls) currentHls.destroy();

            // Hàm seek đến vị trí lịch sử khi video đã tải đủ dữ liệu
            let initialSeekDone = false;
            const applyStartTime = () => {
                if (!initialSeekDone && startTime > 0) {
                    video.currentTime = startTime;
                    initialSeekDone = true;
                }
            };

            if (Hls.isSupported()) {
                currentHls = new Hls({ capLevelToPlayerSize: true, autoStartLoad: true });
                currentHls.loadSource(proxiedUrl);
                currentHls.attachMedia(video);
                currentHls.on(Hls.Events.MANIFEST_PARSED, () => {
                    applyStartTime();
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = proxiedUrl;
                video.addEventListener('loadedmetadata', () => {
                    applyStartTime();
                    video.play().catch(() => {});
                });
            }

            // Tự động lưu Lịch sử xem phim liên tục
            if (movieMeta) {
                let lastSaved = 0;
                const updateHistory = () => {
                    if (video.duration && !isNaN(video.duration)) {
                        saveWatchProgress({
                            ...movieMeta,
                            currentTime: video.currentTime,
                            duration: video.duration
                        });
                    }
                };

                video.ontimeupdate = () => {
                    const now = Date.now();
                    if (now - lastSaved > 3000) { // Lưu mỗi 3 giây
                        lastSaved = now;
                        updateHistory();
                    }
                };

                video.onpause = updateHistory;
                window.onbeforeunload = updateHistory;
            }
        }

        // ========== ROUTER XỬ LÝ ĐƯỜNG DẪN ==========
        async function router() {
            closeMobileMenu();
            if (currentHls) { currentHls.destroy(); currentHls = null; }

            // TỰ ĐỘNG CUỘN LÊN ĐẦU TRANG
            window.scrollTo({ top: 0, behavior: 'smooth' });

            const { route, subRoute, queryParams } = parseHash();
            const page = queryParams.page || 1;

            if (route !== 'phim') {
                cachedMovieData = null;
            }

            if (route === 'home' || route === '') {
                await viewHome();
            } else if (route === 'lich-su') {
                await viewHistory();
            } else if (route === 'danh-sach') {
                const titles = { 
                    'phim-bo': 'Phim Bộ',
                    'phim-le': 'Phim Lẻ',
                    'phim-chieu-rap': 'Phim Chiếu Rạp',
                    'hoat-hinh': 'Hoạt Hình',
                    'tv-shows': 'TV Shows' 
                };
                await viewCatalog(`${API_BASE}/v1/api/danh-sach/${subRoute}?page=${page}`, titles[subRoute] || 'Danh Sách', `#/danh-sach/${subRoute}?`);

            } else if (route === 'the-loai') {
                await viewCatalog(`${API_BASE}/v1/api/the-loai/${subRoute}?page=${page}`, `Thể loại: ${subRoute}`, `#/the-loai/${subRoute}?`);

            } else if (route === 'quoc-gia') {
                await viewCatalog(`${API_BASE}/v1/api/quoc-gia/${subRoute}?page=${page}`, `Quốc gia: ${subRoute}`, `#/quoc-gia/${subRoute}?`);

            } else if (route === 'nam') {
                await viewCatalog(`${API_BASE}/v1/api/nam/${subRoute}?page=${page}`, `Phim năm ${subRoute}`, `#/nam/${subRoute}?`);

            } else if (route === 'tim-kiem') {
                await viewSearch(queryParams.keyword || '', page);
            } else if (route === 'phim') {
                await viewMovieDetail(subRoute, queryParams);
            } else {
                await viewHome();
            }
        }

        // ========== EVENTS ==========
        window.addEventListener('hashchange', router);
        window.addEventListener('DOMContentLoaded', () => {
            loadHeaderMenus();
            router();

            // Tự động đóng dropdown trên màn hình lớn khi click chọn danh mục
            const desktopNav = document.querySelector('nav');
            if (desktopNav) {
                desktopNav.addEventListener('click', (e) => {
                    const link = e.target.closest('a');
                    if (!link) return;
                    
                    const group = link.closest('.group');
                    if (group) {
                        const dropdown = group.querySelector('div[id^="dropdown-"]');
                        if (dropdown) {
                            dropdown.classList.add('!opacity-0', '!invisible');
                            const resetDropdown = () => {
                                dropdown.classList.remove('!opacity-0', '!invisible');
                                group.removeEventListener('mouseleave', resetDropdown);
                            };
                            group.addEventListener('mouseleave', resetDropdown, { once: true });
                            setTimeout(resetDropdown, 800); // Tự giải phóng sau 800ms đề phòng không di chuột
                        }
                    }
                });
            }

            document.getElementById('mobile-menu').addEventListener('click', (e) => {
                if (e.target.closest('a')) {
                    closeMobileMenu();
                }
            });

            document.getElementById('search-form').addEventListener('submit', e => {
                e.preventDefault();
                const kw = document.getElementById('search-input').value.trim();
                if (kw) window.location.hash = `#/tim-kiem?keyword=${encodeURIComponent(kw)}`;
            });

            document.getElementById('search-form-mobile').addEventListener('submit', e => {
                e.preventDefault();
                const kw = document.getElementById('search-input-mobile').value.trim();
                if (kw) {
                    window.location.hash = `#/tim-kiem?keyword=${encodeURIComponent(kw)}`;
                    closeMobileMenu();
                }
            });

            const menuBtn = document.getElementById('mobile-menu-btn');
            const mobileMenu = document.getElementById('mobile-menu');
            menuBtn.addEventListener('click', () => {
                mobileMenu.classList.toggle('hidden');
                const icon = menuBtn.querySelector('i');
                if (mobileMenu.classList.contains('hidden')) {
                    icon.setAttribute('data-lucide', 'menu');
                } else {
                    icon.setAttribute('data-lucide', 'x');
                }
                lucide.createIcons();
            });

            const backBtn = document.getElementById('back-to-top');
            window.addEventListener('scroll', () => {
                if (window.scrollY > 400) {
                    backBtn.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                } else {
                    backBtn.classList.add('opacity-0', 'invisible', 'translate-y-2');
                }
            });
            backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        });
    })();
</script>
</body>
</html>
