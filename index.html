<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Phim Online - OPhim API</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800;14..32,900&family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ef4444',
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    },
                    animation: {
                        shimmer: 'shimmer 1.5s infinite',
                        fadeIn: 'fadeIn 0.3s ease-out',
                        slideUp: 'slideUp 0.4s ease-out',
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' },
                        },
                        fadeIn: {
                            '0%': { opacity: 0 },
                            '100%': { opacity: 1 },
                        },
                        slideUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                    }
                }
            }
        }
    </script>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Custom scrollbar & base */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 8px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #ef4444;
        }

        body {
            background: #020617;
            color: #f1f5f9;
            font-family: 'Inter', system-ui, sans-serif;
        }

        .aspect-poster {
            aspect-ratio: 2 / 3;
        }

        /* Glow effect for logo */
        .logo-glow {
            text-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
        }

        /* Card hover effect */
        .movie-card {
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .movie-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 40px rgba(239, 68, 68, 0.2);
            border-color: rgba(239, 68, 68, 0.5);
        }

        /* Skeleton shimmer */
        .skeleton-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        /* Modal backdrop blur */
        .modal-backdrop {
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        /* Active episode button */
        .episode-btn.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.4);
        }
        .episode-btn:not(.active):hover {
            background: #334155;
            transform: scale(1.05);
        }
        .episode-btn {
            transition: all 0.2s ease;
        }

        /* Server button active */
        .server-btn.active {
            background: #ef4444;
            color: white;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }
        .server-btn:not(.active):hover {
            background: #1e293b;
        }

        /* Pagination */
        .page-btn {
            transition: all 0.2s ease;
        }
        .page-btn:hover:not(:disabled) {
            background: #334155;
            transform: scale(1.05);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Search input focus */
        .search-input:focus {
            border-color: #ef4444;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.2);
        }

        /* Video player container */
        .video-container {
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <header class="sticky top-0 z-40 bg-dark-950/90 backdrop-blur-lg border-b border-dark-800/80">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
            <!-- Logo -->
            <a href="#" onclick="loadCategory('phim-moi')" class="flex items-center gap-2 text-primary text-2xl font-black tracking-wider uppercase font-display logo-glow">
                <i data-lucide="play-circle" class="w-8 h-8 fill-primary text-primary"></i>
                <span>Phim<span class="text-white">Chill</span></span>
            </a>

            <!-- Search Bar -->
            <form onsubmit="handleSearch(event)" class="relative flex-1 max-w-md">
                <input id="searchInput" type="text" placeholder="Tìm kiếm phim (Avengers, Batman...)" 
                       class="search-input w-full bg-dark-800/80 text-sm text-slate-100 rounded-full pl-10 pr-4 py-2.5 border border-dark-700 focus:outline-none transition-all duration-300">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-3.5 text-slate-400"></i>
            </form>

            <!-- Category Menu -->
            <nav class="flex items-center gap-1.5 overflow-x-auto py-1 max-w-full text-sm scrollbar-hide">
                <button onclick="loadCategory('phim-moi')" class="px-4 py-2 rounded-xl hover:bg-dark-800 font-semibold whitespace-nowrap transition-all duration-200 hover:text-primary hover:scale-105">Phim Mới</button>
                <button onclick="loadCategory('phim-bo')" class="px-4 py-2 rounded-xl hover:bg-dark-800 font-semibold whitespace-nowrap transition-all duration-200 hover:text-primary hover:scale-105">Phim Bộ</button>
                <button onclick="loadCategory('phim-le')" class="px-4 py-2 rounded-xl hover:bg-dark-800 font-semibold whitespace-nowrap transition-all duration-200 hover:text-primary hover:scale-105">Phim Lẻ</button>
                <button onclick="loadCategory('hoat-hinh')" class="px-4 py-2 rounded-xl hover:bg-dark-800 font-semibold whitespace-nowrap transition-all duration-200 hover:text-primary hover:scale-105">Hoạt Hình</button>
                <button onclick="loadCategory('tv-shows')" class="px-4 py-2 rounded-xl hover:bg-dark-800 font-semibold whitespace-nowrap transition-all duration-200 hover:text-primary hover:scale-105">TV Shows</button>
            </nav>
        </div>
    </header>

    <!-- ========== MAIN ========== -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <!-- Section Header -->
        <div class="flex items-center justify-between mb-6">
            <h1 id="pageTitle" class="text-2xl font-bold border-l-4 border-primary pl-3 font-display">Danh Sách Phim</h1>
            <div id="pagination" class="flex items-center gap-2"></div>
        </div>

        <!-- Movie Grid -->
        <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
            <!-- Render by JS -->
        </div>

        <!-- Loading Skeleton -->
        <div id="loading" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-5">
            <!-- 6 skeleton cards -->
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
        </div>
    </main>

    <!-- ========== WATCH MODAL ========== -->
    <div id="playerModal" class="fixed inset-0 z-50 bg-black/80 modal-backdrop hidden overflow-y-auto animate-fadeIn">
        <div class="max-w-5xl mx-auto p-4 min-h-screen flex flex-col justify-center">
            <!-- Header -->
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalMovieTitle" class="text-xl font-bold text-slate-100 line-clamp-1 font-display">---</h2>
                <button onclick="closePlayer()" class="p-2.5 hover:bg-dark-800 rounded-full text-slate-400 hover:text-white transition-all duration-200 hover:scale-110">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <!-- Video Player -->
            <div class="video-container relative aspect-video mb-5 border border-dark-700">
                <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
            </div>

            <!-- Episode & Server -->
            <div class="bg-dark-900/80 rounded-2xl p-5 border border-dark-700/60 backdrop-blur-sm space-y-4">
                <div>
                    <h3 class="text-sm font-semibold text-slate-400 mb-3 flex items-center gap-2">
                        <i data-lucide="server" class="w-4 h-4"></i> Chọn Server & Tập Phim
                    </h3>
                    <div id="serverList" class="flex flex-wrap gap-2 mb-4"></div>
                    <div id="episodeList" class="flex flex-wrap gap-2 max-h-48 overflow-y-auto p-1 scrollbar-thin"></div>
                </div>

                <!-- Movie Info -->
                <div class="pt-4 border-t border-dark-700">
                    <p id="modalMovieDesc" class="text-sm text-slate-300 leading-relaxed"></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ========== CONFIG ==========
        const API_BASE = "https://ophim1.com/v1/api";
        const CDN_IMAGE = "https://img.ophim.live/uploads/movies/";

        let currentPage = 1;
        let currentType = 'phim-moi';
        let currentQuery = '';
        let hlsPlayer = null;

        // Init Lucide
        lucide.createIcons();

        // ========== HELPERS ==========
        function getImageUrl(path) {
            if (!path) return 'https://via.placeholder.com/300x450?text=No+Image';
            return path.startsWith('http') ? path : `${CDN_IMAGE}${path}`;
        }

        function showLoading(show) {
            const grid = document.getElementById('movieGrid');
            const skeleton = document.getElementById('loading');
            if (show) {
                grid.classList.add('hidden');
                skeleton.classList.remove('hidden');
            } else {
                grid.classList.remove('hidden');
                skeleton.classList.add('hidden');
            }
        }

        // ========== FETCH ==========
        async function fetchData(url) {
            showLoading(true);
            try {
                const res = await fetch(url);
                const data = await res.json();
                return data;
            } catch (err) {
                console.error("API Error:", err);
                alert("Không thể tải dữ liệu. Vui lòng thử lại!");
            } finally {
                showLoading(false);
            }
        }

        // ========== RENDER MOVIES ==========
        function renderMovies(movies, title = 'Danh Sách Phim') {
            document.getElementById('pageTitle').textContent = title;
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';

            if (!movies || movies.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-16 text-lg">Không tìm thấy phim nào.</div>`;
                return;
            }

            movies.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "movie-card group relative bg-dark-900 rounded-xl overflow-hidden border border-dark-800/60 cursor-pointer flex flex-col transition-all duration-300";
                card.style.animationDelay = `${index * 40}ms`;
                card.onclick = () => openMovieDetail(item.slug);

                const thumb = getImageUrl(item.thumb_url || item.poster_url);

                card.innerHTML = `
                    <div class="relative aspect-poster overflow-hidden bg-dark-950">
                        <img src="${thumb}" alt="${item.name}" loading="lazy" 
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500 ease-out">
                        <span class="absolute top-2 left-2 bg-primary/90 text-white text-xs font-bold px-2.5 py-1 rounded-full shadow-lg backdrop-blur-sm">
                            ${item.episode_current || item.quality || 'HD'}
                        </span>
                        <span class="absolute bottom-2 right-2 bg-dark-950/80 text-xs font-semibold px-2 py-0.5 rounded-full border border-dark-700 backdrop-blur-sm">
                            ${item.year || ''}
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-t from-dark-950/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                    </div>
                    <div class="p-3 flex flex-col flex-1 justify-between">
                        <div>
                            <h3 class="font-bold text-sm line-clamp-1 group-hover:text-primary transition-colors duration-200">${item.name}</h3>
                            <p class="text-xs text-slate-400 line-clamp-1 mt-0.5">${item.origin_name || ''}</p>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ========== PAGINATION ==========
        function renderPagination(paginationData) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            if (!paginationData) return;

            const totalPages = Math.ceil(paginationData.totalItems / paginationData.totalItemsPerPage) || 1;
            if (totalPages <= 1) return;

            const prevBtn = document.createElement('button');
            prevBtn.className = "page-btn px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-xl text-xs font-semibold disabled:opacity-40 disabled:cursor-not-allowed";
            prevBtn.innerText = "‹ Trước";
            prevBtn.disabled = currentPage <= 1;
            prevBtn.onclick = () => changePage(currentPage - 1);

            const nextBtn = document.createElement('button');
            nextBtn.className = "page-btn px-4 py-2 bg-dark-800 hover:bg-dark-700 rounded-xl text-xs font-semibold disabled:opacity-40 disabled:cursor-not-allowed";
            nextBtn.innerText = "Sau ›";
            nextBtn.disabled = currentPage >= totalPages;
            nextBtn.onclick = () => changePage(currentPage + 1);

            const label = document.createElement('span');
            label.className = "text-sm text-slate-400 px-3 font-medium";
            label.innerText = `${currentPage} / ${totalPages}`;

            container.appendChild(prevBtn);
            container.appendChild(label);
            container.appendChild(nextBtn);
        }

        async function changePage(newPage) {
            currentPage = newPage;
            if (currentQuery) {
                const res = await fetchData(`${API_BASE}/tim-kiem?keyword=${encodeURIComponent(currentQuery)}&page=${currentPage}`);
                renderMovies(res?.data?.items, `Kết quả tìm kiếm: "${currentQuery}"`);
                renderPagination(res?.data?.params?.pagination);
            } else {
                loadCategory(currentType, currentPage);
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== LOAD CATEGORY ==========
        async function loadCategory(slug, page = 1) {
            currentType = slug;
            currentQuery = '';
            currentPage = page;
            document.getElementById('searchInput').value = '';

            const res = await fetchData(`${API_BASE}/danh-sach/${slug}?page=${page}`);
            const titleMap = {
                'phim-moi': '🔥 Phim Mới Cập Nhật',
                'phim-bo': '📺 Phim Bộ Đặc Sắc',
                'phim-le': '🎬 Phim Lẻ Hot',
                'tv-shows': '📡 Chương Trình TV',
                'hoat-hinh': '🎨 Phim Hoạt Hình'
            };

            renderMovies(res?.data?.items, titleMap[slug] || 'Danh Sách Phim');
            renderPagination(res?.data?.params?.pagination);
        }

        // ========== SEARCH ==========
        async function handleSearch(e) {
            e.preventDefault();
            const query = document.getElementById('searchInput').value.trim();
            if (!query) return;

            currentQuery = query;
            currentPage = 1;
            const res = await fetchData(`${API_BASE}/tim-kiem?keyword=${encodeURIComponent(query)}&page=1`);
            renderMovies(res?.data?.items, `🔍 Kết quả tìm kiếm: "${query}"`);
            renderPagination(res?.data?.params?.pagination);
        }

        // ========== OPEN MOVIE DETAIL ==========
        async function openMovieDetail(slug) {
            const res = await fetchData(`${API_BASE}/phim/${slug}`);
            if (!res || !res.status) return;

            const movie = res.data.item;
            const episodes = movie.episodes || [];

            document.getElementById('modalMovieTitle').innerText = `${movie.name} (${movie.origin_name})`;
            document.getElementById('modalMovieDesc').innerText = movie.content?.replace(/<[^>]*>?/gm, '') || 'Đang cập nhật nội dung...';

            renderEpisodeButtons(episodes);
            document.getElementById('playerModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';

            if (episodes.length > 0 && episodes[0].server_data.length > 0) {
                playStream(episodes[0].server_data[0].link_m3u8);
            }
        }

        // ========== RENDER EPISODES ==========
        function renderEpisodeButtons(episodes) {
            const serverList = document.getElementById('serverList');
            const episodeList = document.getElementById('episodeList');
            serverList.innerHTML = '';
            episodeList.innerHTML = '';

            if (!episodes || episodes.length === 0) {
                episodeList.innerHTML = `<p class="text-xs text-slate-400">Phim chưa có link xem.</p>`;
                return;
            }

            let activeServerIdx = 0;

            const loadEpisodesForServer = (serverIdx) => {
                activeServerIdx = serverIdx;

                // Update server buttons
                Array.from(serverList.children).forEach((btn, idx) => {
                    btn.className = `server-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 ${idx === serverIdx ? 'active' : 'bg-dark-800 text-slate-300 hover:bg-dark-700'}`;
                });

                episodeList.innerHTML = '';
                const epData = episodes[serverIdx].server_data || [];

                epData.forEach((ep, epIdx) => {
                    const epBtn = document.createElement('button');
                    epBtn.className = `episode-btn px-4 py-2 rounded-xl text-xs font-medium transition-all duration-200 bg-dark-800 text-slate-300 ${epIdx === 0 ? 'active' : ''}`;
                    epBtn.innerText = ep.name;
                    epBtn.onclick = () => {
                        Array.from(episodeList.children).forEach(b => b.classList.remove('active'));
                        epBtn.classList.add('active');
                        playStream(ep.link_m3u8);
                    };
                    episodeList.appendChild(epBtn);
                });
            };

            // Render servers
            episodes.forEach((serv, idx) => {
                const servBtn = document.createElement('button');
                servBtn.className = `server-btn px-4 py-2 rounded-xl text-xs font-semibold transition-all duration-200 ${idx === 0 ? 'active' : 'bg-dark-800 text-slate-300 hover:bg-dark-700'}`;
                servBtn.innerText = serv.server_name;
                servBtn.onclick = () => loadEpisodesForServer(idx);
                serverList.appendChild(servBtn);
            });

            loadEpisodesForServer(0);
        }

        // ========== PLAY STREAM ==========
        function playStream(url) {
            const video = document.getElementById('videoPlayer');

            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, function () {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = url;
                video.addEventListener('loadedmetadata', function () {
                    video.play().catch(() => {});
                });
            } else {
                alert('Trình duyệt của bạn không hỗ trợ phát m3u8.');
            }
        }

        // ========== CLOSE PLAYER ==========
        function closePlayer() {
            const video = document.getElementById('videoPlayer');
            video.pause();
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
            document.getElementById('playerModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // ========== INIT ==========
        loadCategory('phim-moi');

        // Close modal on Escape key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closePlayer();
        });
    </script>

</body>
</html>
