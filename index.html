<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <!-- 🔧 FIX: Viewport chuẩn, chống phình to khi xoay màn hình -->

    <!-- Font chữ -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif']
                    },
                    colors: {
                        brand: {
                            DEFAULT: '#e50914',
                            dark: '#b90910',
                            light: '#ff1a25'
                        }
                    },
                    animation: {
                        'shimmer': 'shimmer 2s infinite linear',
                        'fade-in': 'fadeIn 0.5s ease-out'
                    },
                    keyframes: {
                        shimmer: {
                            '0%': { backgroundPosition: '-200% 0' },
                            '100%': { backgroundPosition: '200% 0' }
                        },
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' }
                        }
                    }
                }
            }
        }

    <style>
        /* 🔧 FIX: Ngăn tràn ngang gây phình to */
        html,
        body {
            overflow-x: hidden !important;
            width: 100%;
            max-width: 100%;
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #e50914;
        }

        .swiper-pagination-bullet {
            background: #94a3b8;
            opacity: 0.5;
        }
        .swiper-pagination-bullet-active {
            background: #e50914;
            opacity: 1;
        }

        .skeleton {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }

        media-player {
            --video-brand: #e50914;
            --media-focus-ring-color: #e50914;
            border-radius: 0.75rem;
            overflow: hidden;
        }

        /* 🔧 FIX: Tối ưu hiển thị khi xoay ngang */
        @media (max-width: 820px) and (orientation: landscape) {
            .grid-cols-2 {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            }
            .hero-swiper .swiper-slide {
                aspect-ratio: 16/9 !important;
            }
            header .max-w-7xl {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
            #app-content {
                padding-left: 1rem !important;
                padding-right: 1rem !important;
            }
        }

        @media (max-width: 640px) {
            .grid-cols-2 {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
            .gap-4 {
                gap: 0.75rem;
            }
            .gap-6 {
                gap: 1rem;
            }
            .p-6 {
                padding: 1rem;
            }
            .text-2xl {
                font-size: 1.25rem;
                line-height: 1.75rem;
            }
            .text-xl {
                font-size: 1.125rem;
                line-height: 1.5rem;
            }
        }

        @media (min-width: 641px) and (max-width: 820px) and (orientation: landscape) {
            .grid-cols-2 {
                grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
            }
        }

        @media (min-width: 768px) {
            .grid-cols-2 {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }
        @media (min-width: 1024px) {
            .grid-cols-2 {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }
        @media (min-width: 1280px) {
            .grid-cols-2 {
                grid-template-columns: repeat(5, minmax(0, 1fr));
            }
        }
        @media (min-width: 1536px) {
            .grid-cols-2 {
                grid-template-columns: repeat(6, minmax(0, 1fr));
            }
        }

        .dropdown-menu {
            max-height: 70vh;
            overflow-y: auto;
        }
        .dropdown-scroll::-webkit-scrollbar {
            width: 3px;
        }
        .dropdown-scroll::-webkit-scrollbar-thumb {
            background: #475569;
            border-radius: 10px;
        }

        .accordion-content {
            transition: all 0.2s ease;

        .accordion-toggle .lucide-chevron-down {
            transition: transform 0.2s ease;
        }
        .accordion-toggle.open .lucide-chevron-down {
            transform: rotate(180deg);

        .max-w-7xl {
            max-width: 100% !important;
        }

        #app-content {
            min-height: 60vh;
        }
    </style>

    <script>
        (function() {
            const API_BASE = 'https://phimapi.com';
            const IMG_DOMAIN = 'https://phimimg.com';
            const HISTORY_KEY = 'phimflix_history_v1';

            let categoriesCache = [];
            let countriesCache = [];
            let yearsCache = [];
            let homeSwiper = null;
            let cachedMovieData = null;

            // 🔧 FIX: Xử lý sự kiện xoay màn hình để reset viewport
            function handleOrientationChange() {
                // Đợi trình duyệt hoàn tất xoay
                setTimeout(function() {
                    // Force reflow để trình duyệt tính toán lại layout
                    document.body.style.display = 'none';
                    void document.body.offsetHeight; // trigger reflow
                    document.body.style.display = '';

                    // Cuộn lên đầu để reset vị trí
                    window.scrollTo(0, 0);

                    // Đảm bảo viewport scale về 1.0
                    const meta = document.querySelector('meta[name=viewport]');
                    if (meta) {
                        const content = meta.getAttribute('content');
                        // Nếu có scale khác 1.0 thì reset
                        if (content && (content.includes('initial-scale=') || content.includes('maximum-scale='))) {
                            // Không cần thay đổi vì meta đã có initial-scale=1.0, maximum-scale=1.0
                        }
                    }
                }, 350);
            }

            // Lắng nghe sự kiện xoay màn hình
            if (window.orientation !== undefined) {
                window.addEventListener('orientationchange', handleOrientationChange);
            }
            // Fallback cho resize (một số trình duyệt không support orientationchange)
            let resizeTimer = null;
            window.addEventListener('resize', function() {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(function() {
                    // Chỉ xử lý khi chiều rộng thay đổi đáng kể (xoay màn hình)
                    if (window.innerWidth < 820) {
                        handleOrientationChange();
                    }
                }, 400);
            });

            // Đăng ký Service Worker
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./service-worker.js')
                        .then(reg => console.log('Service Worker đã sẵn sàng:', reg.scope))
                        .catch(err => console.error('Lỗi đăng ký Service Worker:', err));
                });
            }

            // --- LỊCH SỬ XEM PHIM ---
            function getWatchHistory() {
                try {
                    return JSON.parse(localStorage.getItem(HISTORY_KEY)) || {};
                } catch (e) {
                    return {};
                }
            }

            function saveWatchProgress(movieInfo) {
                if (!movieInfo || !movieInfo.slug) return;
                const history = getWatchHistory();
                history[movieInfo.slug] = {
                    slug: movieInfo.slug,
                    name: movieInfo.name,
                    origin_name: movieInfo.origin_name || '',
                    poster_url: movieInfo.poster_url || '',
                    thumb_url: movieInfo.thumb_url || '',
                    ep_slug: movieInfo.ep_slug,
                    ep_name: movieInfo.ep_name,
                    server_idx: movieInfo.server_idx,
                    server_name: movieInfo.server_name,
                    currentTime: movieInfo.currentTime || 0,
                    duration: movieInfo.duration || 0,
                    updatedAt: Date.now()
                };
                try {
                    localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
                } catch (e) { console.error('Lỗi lưu lịch sử:', e); }
            }

            function removeHistoryItem(slug) {
                const history = getWatchHistory();
                delete history[slug];
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            }

            function clearAllHistory() {
                localStorage.removeItem(HISTORY_KEY);
            }

            function formatTime(seconds) {
                if (!seconds || isNaN(seconds) || seconds < 0) return '00:00';
                const m = Math.floor(seconds / 60);
                const s = Math.floor(seconds % 60);
                return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            }

            // --- Helpers ---
            const getImageUrl = (path) => {
                if (!path) return 'https://via.placeholder.com/300x450?text=No+Cover';
                if (path.startsWith('http')) return path;
                return `${IMG_DOMAIN}/${path.replace(/^\//, '')}`;
            };

            const parseHash = () => {
                const hash = window.location.hash.slice(1) || '/';
                const [pathAndQuery, queryString] = hash.split('?');
                const parts = pathAndQuery.split('/').filter(Boolean);
                const params = new URLSearchParams(queryString || '');
                return {
                    route: parts[0] || 'home',
                    subRoute: parts[1] || '',
                    param: parts[2] || '',
                    queryParams: Object.fromEntries(params.entries())
                };
            };

            const extractArray = (res) => {
                if (!res) return [];
                if (Array.isArray(res)) return res;
                if (Array.isArray(res.data)) return res.data;
                if (Array.isArray(res.data?.items)) return res.data.items;
                if (Array.isArray(res.items)) return res.items;
                return [];
            };

            function closeMobileMenu() {
                const mobileMenu = document.getElementById('mobile-menu');
                const menuBtnIcon = document.getElementById('mobile-menu-btn')?.querySelector('i');
                if (mobileMenu && !mobileMenu.classList.contains('hidden')) {
                    mobileMenu.classList.add('hidden');
                    if (menuBtnIcon) {
                        menuBtnIcon.setAttribute('data-lucide', 'menu');
                        lucide.createIcons();
                    }
                }
            }

            function showSkeleton() {
                document.getElementById('app-content').innerHTML = `
                        <div class="space-y-8 animate-pulse">
                            <div class="skeleton h-56 md:h-80 lg:h-96 rounded-2xl"></div>
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-3 md:gap-5">
                                ${Array(12).fill('<div class="aspect-[2/3] skeleton rounded-xl"></div>').join('')}
                            </div>
                        </div>
                    `;
            }

            function renderPagination(pagination, hashPrefix) {
                if (!pagination || pagination.totalPages <= 1) return '';
                const current = pagination.currentPage;
                const total = pagination.totalPages;
                let html = '<div class="flex items-center justify-center gap-2 sm:gap-3 mt-8 md:mt-10 flex-wrap">';
                if (current > 1) {
                    html +=
                        `<a href="${hashPrefix}page=${current-1}" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-800 hover:bg-slate-700 text-xs sm:text-sm font-semibold rounded-lg border border-slate-700 transition flex items-center gap-1"><i data-lucide="chevron-left" class="w-4 h-4"></i> <span class="hidden sm:inline">Trước</span></a>`;
                }
                html +=
                    `<span class="px-3 py-1.5 sm:px-4 sm:py-2 bg-slate-900 border border-slate-800 text-xs sm:text-sm rounded-lg text-slate-400">Trang <strong class="text-white">${current}</strong> / ${total}</span>`;
                if (current < total) {
                    html +=
                        `<a href="${hashPrefix}page=${current+1}" class="px-3 py-1.5 sm:px-4 sm:py-2 bg-brand hover:bg-brand-dark text-xs sm:text-sm font-semibold rounded-lg transition flex items-center gap-1"><span class="hidden sm:inline">Sau</span> <i data-lucide="chevron-right" class="w-4 h-4"></i></a>`;
                }
                html += '</div>';
                return html;
            }

            function renderMovieCard(movie) {
                const title = movie.name || '';
                const origin = movie.origin_name || '';
                const year = movie.year || '';
                const quality = movie.quality || movie.episode_current || 'HD';
                const poster = getImageUrl(movie.poster_url || movie.thumb_url);
                const slug = movie.slug;

                return `

            async function loadHeaderMenus() {
                try {
                    const [catRes, counRes, yearRes] = await Promise.all([
                        fetch(`${API_BASE}/the-loai`).then(r => r.json()).catch(() => []),
                        fetch(`${API_BASE}/quoc-gia`).then(r => r.json()).catch(() => []),
                        fetch(`${API_BASE}/nam-phat-hanh`).then(r => r.json()).catch(() => [])
                    ]);

                    categoriesCache = extractArray(catRes);
                    countriesCache = extractArray(counRes);
                    yearsCache = extractArray(yearRes);

                    // 1. Thể Loại
                    if (categoriesCache.length > 0) {
                        const html = categoriesCache.map(c => {
                            const name = typeof c === 'object' ? (c.name || c.title || '') : c;
                            const slug = typeof c === 'object' ? (c.slug || c.name || '') : c;
                            if (!name) return '';
                            return `<a href="#/the-loai/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors">${name}</a>`;
                        }).filter(Boolean).join('');
                        document.getElementById('dropdown-theloai').innerHTML = html;
                        document.querySelector('.mobile-theloai-content').innerHTML = html;
                    }

                    // 2. Quốc Gia
                    if (countriesCache.length > 0) {
                        const html = countriesCache.map(c => {
                            const name = typeof c === 'object' ? (c.name || c.title || '') : c;
                            const slug = typeof c === 'object' ? (c.slug || c.name || '') : c;
                            if (!name) return '';
                            return `<a href="#/quoc-gia/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors">${name}</a>`;
                        }).filter(Boolean).join('');
                        document.getElementById('dropdown-quocgia').innerHTML = html;
                        document.querySelector('.mobile-quocgia-content').innerHTML = html;
                    }

                    // 3. Năm Phát Hành
                    if (yearsCache.length > 0) {
                        const html = yearsCache.map(y => {
                            let name = typeof y === 'object' ? (y.name || y.year || y.slug || '') : y;
                            let slug = typeof y === 'object' ? (y.slug || y.name || y.year || '') : y;
                            if (!name || name === 'undefined') return '';
                            return `<a href="#/nam/${slug}" class="px-2 py-1.5 hover:bg-slate-800 rounded-lg text-xs text-slate-300 hover:text-brand transition-colors text-center">${name}</a>`;
                        }).filter(Boolean).join('');
                        document.getElementById('dropdown-nam').innerHTML = html;
                        document.querySelector('.mobile-nam-content').innerHTML = html;
                    }

                    // Kích hoạt accordion cho mobile
                    document.querySelectorAll('.accordion-toggle').forEach(btn => {
                        btn.addEventListener('click', function(e) {
                            e.stopPropagation();
                            const content = this.nextElementSibling;
                            content.classList.toggle('hidden');
                            this.classList.toggle('open');
                            lucide.createIcons();
                        });
                    });

                } catch (e) {
                    console.error('Lỗi nạp menu:', e);
                }
            }

                                            <div>
                                                <h3 class="text-xs sm:text-sm font-bold text-slate-300 mb-2">📂 Danh sách tập</h3>
                                                <div class="grid grid-cols-4 sm:grid-cols-6 md:grid-cols-8 gap-1.5 sm:gap-2 max-h-48 md:max-h-60 overflow-y-auto pr-1">
                                                    ${(episodes[activeServerIdx]?.server_data || []).map(ep => {
                                                        const isActive = ep.slug === activeEpSlug;
                                                        return `<a href="#/phim/${movie.slug}?ep=${ep.slug}&sv=${activeServerIdx}" class="px-1.5 py-1.5 sm:px-2 sm:py-2 text-center text-[10px] sm:text-xs font-bold rounded-lg transition border ${isActive?'bg-brand text-white border-brand shadow-lg shadow-brand/20':'bg-slate-800 border-slate-700/50 text-slate-300 hover:bg-slate-700'}">${ep.name}</a>`;
                                                    }).join('')}
                                                </div>
                                            </div>
                                        </div>
                                    ` : '<p class="text-slate-400 italic text-sm">⏳ Chưa có tập phát sóng.</p>'}

                                    <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-xl md:rounded-2xl p-3 md:p-5 space-y-2 md:space-y-3">
                                        <h3 class="text-base md:text-lg font-bold text-white flex items-center gap-2"><i data-lucide="file-text" class="w-4 h-4 md:w-5 md:h-5 text-brand"></i> 📖 Nội dung phim</h3>
                                        <div class="text-xs sm:text-sm text-slate-300 leading-relaxed">${movie.content || 'Đang cập nhật...'}</div>
                                    </div>
                                </div>

                                <div class="space-y-4 md:space-y-6">
                                    <div class="bg-slate-900/80 backdrop-blur-sm border border-slate-800 rounded-xl md:rounded-2xl p-3 md:p-5 space-y-3 md:space-y-4 sticky top-20">
                                        <div class="flex gap-3 md:gap-4">
                                            <img src="${getImageUrl(movie.poster_url)}" class="w-20 sm:w-24 h-28 sm:h-36 object-cover rounded-lg md:rounded-xl border border-slate-800 shadow-lg">
                                            <div>
                                                <h2 class="font-bold text-sm sm:text-base text-white">${movie.name}</h2>
                                                <p class="text-[10px] sm:text-xs text-slate-400">${movie.origin_name}</p>
                                                <div class="flex flex-wrap gap-1 mt-1.5">
                                                    <span class="px-1.5 py-0.5 bg-brand/20 text-brand font-bold text-[9px] sm:text-[10px] rounded border border-brand/30">${movie.quality||'HD'}</span>
                                                    <span class="px-1.5 py-0.5 bg-slate-800 text-slate-300 font-bold text-[9px] sm:text-[10px] rounded">${movie.lang||'Vietsub'}</span>
                                                </div>
                                            </div>
                                        </div>
                                        <hr class="border-slate-800">
                                        <ul class="space-y-1.5 text-[10px] sm:text-xs text-slate-300">
                                            <li class="flex justify-between"><span class="text-slate-500">Trạng thái</span> <span class="font-medium text-brand">${movie.episode_current}</span></li>
                                            <li class="flex justify-between"><span class="text-slate-500">Thời lượng</span> <span>${movie.time||'N/A'}</span></li>
                                            <li class="flex justify-between"><span class="text-slate-500">Năm</span> <span>${movie.year}</span></li>
                                            <li class="flex justify-between"><span class="text-slate-500">Quốc gia</span> <span>${(movie.country||[]).map(c=>c.name).join(', ')}</span></li>
                                            <li><span class="text-slate-500 block mb-0.5">Thể loại</span><div class="flex flex-wrap gap-1">${(movie.category||[]).map(c=>`<span class="px-1.5 py-0.5 bg-slate-800 rounded text-[9px] sm:text-[10px]">${c.name}</span>`).join('')}</div></li>
                                            <li class="flex justify-between"><span class="text-slate-500">Đạo diễn</span> <span>${(movie.director||[]).join(', ')||'N/A'}</span></li>
                                            <li class="flex justify-between"><span class="text-slate-500">Diễn viên</span> <span class="text-right">${(movie.actor||[]).join(', ')||'N/A'}</span></li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>`;

                document.getElementById('app-content').innerHTML = html;
                lucide.createIcons();

                if (currentPlayingEp && currentPlayingEp.link_m3u8) {
                    const currentServerName = episodes[activeServerIdx]?.server_name || 'Server HD';
                    const currentEpName = currentPlayingEp.name || 'Tập phim';

                    initVidstackPlayer(currentPlayingEp.link_m3u8, startTime, {
                        slug: movie.slug,
                        name: movie.name,
                        origin_name: movie.origin_name,
                        poster_url: movie.poster_url,
                        thumb_url: movie.thumb_url,
                        ep_slug: activeEpSlug,
                        ep_name: currentEpName,
                        server_idx: activeServerIdx,
                        server_name: currentServerName
                    });

                    document.getElementById('media-container').scrollIntoView({ behavior: 'smooth' });
                }
            }

            // KHỞI TẠO VIDSTACK PLAYER
            function initVidstackPlayer(url, startTime = 0, movieMeta = null) {
                const player = document.getElementById('vidstack-player');
                if (!player) return;

                const proxiedUrl = `/proxy-stream?url=${encodeURIComponent(url)}`;

                player.src = {
                    src: proxiedUrl,
                    type: 'application/x-mpegurl'
                };

                let initialSeekDone = false;

                player.addEventListener('can-play', () => {
                    if (!initialSeekDone && startTime > 0) {
                        player.currentTime = startTime;
                        initialSeekDone = true;
                    }
                    player.play().catch(() => {});
                }, { once: true });

                if (movieMeta) {
                    let lastSaved = 0;
                    const updateHistory = () => {
                        if (player.duration && !isNaN(player.duration)) {
                            saveWatchProgress({
                                ...movieMeta,
                                currentTime: player.currentTime,
                                duration: player.duration
                            });
                        }
                    };

                    player.addEventListener('time-update', () => {
                        const now = Date.now();
                        if (now - lastSaved > 3000) {
                            lastSaved = now;
                            updateHistory();
                        }
                    });

                    player.addEventListener('pause', updateHistory);
                    window.onbeforeunload = updateHistory;
                }
            }

            // ========== ROUTER ==========
            async function router() {
                closeMobileMenu();
                window.scrollTo({ top: 0, behavior: 'smooth' });

                const { route, subRoute, queryParams } = parseHash();
                const page = queryParams.page || 1;

                if (route !== 'phim') {
                    cachedMovieData = null;
                }

                if (route === 'home' || route === '') {
                    await viewHome();
                } else if (route === 'lich-su') {
                    await viewHistory();
                } else if (route === 'danh-sach') {
                    const titles = {
                        'phim-bo': 'Phim Bộ',
                        'phim-le': 'Phim Lẻ',
                        'phim-chieu-rap': 'Phim Chiếu Rạp',
                        'hoat-hinh': 'Hoạt Hình',
                        'tv-shows': 'TV Shows'
                    };
                    await viewCatalog(`${API_BASE}/v1/api/danh-sach/${subRoute}?page=${page}`, titles[subRoute] ||
                        'Danh Sách', `#/danh-sach/${subRoute}?`);

                } else if (route === 'the-loai') {
                    await viewCatalog(`${API_BASE}/v1/api/the-loai/${subRoute}?page=${page}`, `Thể loại: ${subRoute}`,
                        `#/the-loai/${subRoute}?`);

                } else if (route === 'quoc-gia') {
                    await viewCatalog(`${API_BASE}/v1/api/quoc-gia/${subRoute}?page=${page}`, `Quốc gia: ${subRoute}`,
                        `#/quoc-gia/${subRoute}?`);

                } else if (route === 'nam') {
                    await viewCatalog(`${API_BASE}/v1/api/nam/${subRoute}?page=${page}`, `Phim năm ${subRoute}`,
                        `#/nam/${subRoute}?`);

                } else if (route === 'tim-kiem') {
                    await viewSearch(queryParams.keyword || '', page);
                } else if (route === 'phim') {
                    await viewMovieDetail(subRoute, queryParams);
                } else {
                    await viewHome();
                }
            }

            // ========== EVENTS ==========
            window.addEventListener('hashchange', router);
            window.addEventListener('DOMContentLoaded', () => {
                loadHeaderMenus();
                router();

                // Form tìm kiếm
                const searchForms = [
                    { formId: 'search-form-mobile-header', inputId: 'search-input-mobile-header' },
                    { formId: 'search-form-mobile-menu', inputId: 'search-input-mobile-menu' },
                    { formId: 'search-form-desktop', inputId: 'search-input-desktop' }
                ];
                searchForms.forEach(({ formId, inputId }) => {
                    const form = document.getElementById(formId);
                    if (form) {
                        form.addEventListener('submit', (e) => {
                            e.preventDefault();
                            const kw = document.getElementById(inputId).value.trim();
                            if (kw) {
                                window.location.hash = `#/tim-kiem?keyword=${encodeURIComponent(kw)}`;
                                closeMobileMenu();
                            }
                        });
                    }
                });

                // Mobile menu toggle
                const menuBtn = document.getElementById('mobile-menu-btn');
                const mobileMenu = document.getElementById('mobile-menu');
                menuBtn.addEventListener('click', () => {
                    mobileMenu.classList.toggle('hidden');
                    const icon = menuBtn.querySelector('i');
                    if (mobileMenu.classList.contains('hidden')) {
                        icon.setAttribute('data-lucide', 'menu');
                    } else {
                        icon.setAttribute('data-lucide', 'x');
                    }
                    lucide.createIcons();
                });

                mobileMenu.addEventListener('click', (e) => {
                    if (e.target.closest('a')) {
                        closeMobileMenu();
                    }
                });

                // Back to top
                const backBtn = document.getElementById('back-to-top');
                window.addEventListener('scroll', () => {
                    if (window.scrollY > 400) {
                        backBtn.classList.remove('opacity-0', 'invisible', 'translate-y-2');
                    } else {
                        backBtn.classList.add('opacity-0', 'invisible', 'translate-y-2');
                    }
                });
                backBtn.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
            });
        })();
    </script>
</body>
</html>
