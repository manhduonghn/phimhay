<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhimStream - Xem Phim HD</title>
    <link rel="stylesheet" href="style.css">
    <!-- Thư viện Hls.js để play link m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="logo">Phim<span>Stream</span></a>
        <div class="nav-links">
            <a href="/type/phim-bo">Phim Bộ</a>
            <a href="/type/phim-le">Phim Lẻ</a>
            <a href="/type/hoat-hinh">Hoạt Hình</a>
            <a href="/type/tv-shows">TV Shows</a>
        </div>
        <form id="search-form" class="search-box">
            <input type="text" id="search-input" placeholder="Tìm kiếm phim...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <!-- Main Content -->
    <main id="app">
        <!-- Nội dung sẽ được render bằng JS -->
    </main>

    <!-- Modal for Player (Dùng để hiển thị player nổi) -->
    <div id="player-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div id="player-container"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
