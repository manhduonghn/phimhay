<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phim Hay - Xem phim online</title>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest">
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
               RESET & BASE
            ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a12;
            --bg-secondary: #111122;
            --bg-card: #16162a;
            --bg-card-hover: #1e1e38;
            --bg-input: #1a1a30;
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --text-muted: #6a6a82;
            --accent: #e50914;
            --accent-hover: #ff1a2a;
            --accent-glow: rgba(229, 9, 20, 0.3);
            --gold: #f5c518;
            --radius: 12px;
            --radius-sm: 8px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        img {
            max-width: 100%;
            display: block;
        }

        button {
            cursor: pointer;
            font-family: inherit;
            border: none;
            background: none;
            color: inherit;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-secondary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-hover);
        }

        /* ============================================================
               LOADING
            ============================================================ */
        .app-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 20px;
        }
        .app-loading .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--bg-card);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
        .app-loading p {
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: 1px;
        }

        /* ============================================================
               HEADER
            ============================================================ */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 18, 0.92);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: -0.5px;
            color: #fff;
        }
        .header-brand span {
            color: var(--accent);
        }
        .header-brand i {
            font-size: 26px;
            color: var(--accent);
        }

        .header-nav {
            display: flex;
            align-items: center;
            gap: 4px;
            flex-wrap: wrap;
        }
        .header-nav a {
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            transition: var(--transition);
            white-space: nowrap;
        }
        .header-nav a:hover,
        .header-nav a.active {
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
        }
        .header-nav a.active {
            background: var(--accent);
            color: #fff;
        }

        .header-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-input);
            border-radius: 30px;
            padding: 0 16px;
            border: 1px solid transparent;
            transition: var(--transition);
            flex-shrink: 0;
        }
        .header-search:focus-within {
            border-color: var(--accent);
            background: var(--bg-card);
        }
        .header-search input {
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 14px;
            padding: 8px 0;
            width: 160px;
            font-weight: 400;
        }
        .header-search input::placeholder {
            color: var(--text-muted);
        }
        .header-search button {
            color: var(--text-muted);
            font-size: 16px;
            transition: var(--transition);
            padding: 4px;
        }
        .header-search button:hover {
            color: #fff;
        }

        .header-menu-toggle {
            display: none;
            font-size: 22px;
            color: #fff;
            padding: 4px 8px;
        }

        /* ============================================================
               MAIN CONTAINER
            ============================================================ */
        .main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px 24px 60px;
        }

        /* ============================================================
               PAGE SECTIONS
            ============================================================ */
        .page {
            animation: fadeUp 0.4s ease;
        }
        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .page-header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .page-header h1 i {
            color: var(--accent);
            margin-right: 10px;
        }
        .page-header .badge {
            font-size: 14px;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 4px 16px;
            border-radius: 30px;
            font-weight: 500;
        }

        /* ============================================================
               MOVIE GRID
            ============================================================ */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }

        .movie-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 255, 255, 0.06);
            box-shadow: var(--shadow);
        }

        .movie-card .poster {
            position: relative;
            aspect-ratio: 2/3;
            overflow: hidden;
            background: var(--bg-secondary);
        }
        .movie-card .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: var(--transition);
        }
        .movie-card:hover .poster img {
            transform: scale(1.04);
        }

        .movie-card .poster .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, rgba(0, 0, 0, 0.7) 0%, transparent 60%);
            opacity: 0;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .movie-card:hover .poster .overlay {
            opacity: 1;
        }
        .movie-card .poster .overlay i {
            font-size: 44px;
            color: #fff;
            background: rgba(229, 9, 20, 0.85);
            border-radius: 50%;
            padding: 16px 18px 16px 20px;
            transform: scale(0.8);
            transition: var(--transition);
        }
        .movie-card:hover .poster .overlay i {
            transform: scale(1);
        }

        .movie-card .poster .episode-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            padding: 3px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .movie-card .poster .quality-badge {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: var(--accent);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 4px;
            letter-spacing: 0.5px;
        }

        .movie-card .info {
            padding: 14px 14px 16px;
        }
        .movie-card .info h3 {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
            margin-bottom: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .movie-card .info .meta {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--text-secondary);
        }
        .movie-card .info .meta .year {
            background: var(--bg-secondary);
            padding: 0 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .movie-card .info .meta .rating {
            color: var(--gold);
            font-weight: 600;
        }
        .movie-card .info .meta .rating i {
            margin-right: 2px;
        }

        /* ============================================================
               PAGINATION
            ============================================================ */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 36px;
            flex-wrap: wrap;
        }
        .pagination button {
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            background: var(--bg-card);
            color: var(--text-secondary);
            transition: var(--transition);
            min-width: 40px;
            text-align: center;
        }
        .pagination button:hover:not(:disabled) {
            background: var(--bg-card-hover);
            color: #fff;
        }
        .pagination button.active {
            background: var(--accent);
            color: #fff;
        }
        .pagination button:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* ============================================================
               MOVIE DETAIL
            ============================================================ */
        .detail-hero {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 32px;
            margin-bottom: 40px;
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 28px;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .detail-hero .poster {
            border-radius: var(--radius-sm);
            overflow: hidden;
            aspect-ratio: 2/3;
            background: var(--bg-secondary);
            box-shadow: var(--shadow);
        }
        .detail-hero .poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .detail-hero .info {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .detail-hero .info .title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            line-height: 1.2;
        }
        .detail-hero .info .title .original {
            font-weight: 400;
            font-size: 18px;
            color: var(--text-secondary);
            margin-left: 10px;
        }
        .detail-hero .info .meta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 20px;
            font-size: 14px;
            color: var(--text-secondary);
        }
        .detail-hero .info .meta-row .label {
            color: var(--text-muted);
        }
        .detail-hero .info .meta-row .value {
            color: #fff;
            font-weight: 500;
        }
        .detail-hero .info .meta-row .value.rating {
            color: var(--gold);
        }

        .detail-hero .info .description {
            color: var(--text-secondary);
            font-size: 15px;
            line-height: 1.7;
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .detail-hero .info .description.expanded {
            -webkit-line-clamp: unset;
        }
        .detail-hero .info .read-more {
            color: var(--accent);
            font-weight: 500;
            font-size: 14px;
            cursor: pointer;
            display: inline-block;
            width: fit-content;
        }
        .detail-hero .info .read-more:hover {
            color: var(--accent-hover);
        }

        .detail-hero .info .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .detail-hero .info .genres .tag {
            background: var(--bg-secondary);
            padding: 2px 14px;
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .detail-hero .info .genres .tag:hover {
            background: var(--bg-card-hover);
            color: #fff;
        }

        /* ============================================================
               PLAYER
            ============================================================ */
        .player-section {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 32px;
        }
        .player-section .player-wrapper {
            position: relative;
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
        }
        .player-section .player-wrapper video {
            width: 100%;
            height: 100%;
            display: block;
        }
        .player-section .player-wrapper .player-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: var(--text-secondary);
            background: var(--bg-secondary);
        }
        .player-section .player-wrapper .player-placeholder i {
            font-size: 56px;
            color: var(--accent);
            opacity: 0.6;
        }
        .player-section .player-wrapper .player-placeholder p {
            font-size: 16px;
            font-weight: 500;
        }

        .player-section .player-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-secondary);
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-section .player-controls .server-select {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .player-section .player-controls .server-select label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
        }
        .player-section .player-controls .server-select select {
            background: var(--bg-input);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius-sm);
            padding: 6px 12px;
            font-size: 13px;
            outline: none;
            cursor: pointer;
        }
        .player-section .player-controls .server-select select:focus {
            border-color: var(--accent);
        }

        .player-section .episode-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 20px 16px;
            max-height: 120px;
            overflow-y: auto;
            background: var(--bg-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.04);
        }
        .player-section .episode-list .ep-btn {
            padding: 4px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            background: var(--bg-input);
            color: var(--text-secondary);
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .player-section .episode-list .ep-btn:hover {
            background: var(--bg-card-hover);
            color: #fff;
        }
        .player-section .episode-list .ep-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============================================================
               FILTER BAR (for genre/country/year)
            ============================================================ */
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 12px;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .filter-bar .filter-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-right: 4px;
        }
        .filter-bar .filter-tag {
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 13px;
            background: var(--bg-input);
            color: var(--text-secondary);
            transition: var(--transition);
            border: 1px solid transparent;
            cursor: pointer;
        }
        .filter-bar .filter-tag:hover {
            background: var(--bg-card-hover);
            color: #fff;
        }
        .filter-bar .filter-tag.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* ============================================================
               HOME SECTIONS
            ============================================================ */
        .home-section {
            margin-bottom: 40px;
        }
        .home-section .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .home-section .section-header h2 {
            font-size: 22px;
            font-weight: 700;
        }
        .home-section .section-header h2 i {
            color: var(--accent);
            margin-right: 8px;
        }
        .home-section .section-header .view-all {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
        }
        .home-section .section-header .view-all:hover {
            color: #fff;
        }

        .home-section .movie-grid {
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        }

        /* ============================================================
               SEARCH PAGE
            ============================================================ */
        .search-stats {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 20px;
        }
        .search-stats strong {
            color: #fff;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }
        .no-results i {
            font-size: 56px;
            opacity: 0.3;
            margin-bottom: 16px;
        }
        .no-results h3 {
            font-size: 20px;
            color: #fff;
            margin-bottom: 4px;
        }

        /* ============================================================
               RESPONSIVE
            ============================================================ */
        @media (max-width: 1024px) {
            .detail-hero {
                grid-template-columns: 220px 1fr;
                padding: 20px;
            }
            .detail-hero .info .title {
                font-size: 26px;
            }
        }

        @media (max-width: 820px) {
            .header {
                padding: 0 16px;
                height: 60px;
                flex-wrap: wrap;
                gap: 8px;
            }
            .header-nav {
                display: none;
                flex-basis: 100%;
                flex-wrap: wrap;
                justify-content: center;
                padding: 8px 0 4px;
                gap: 2px;
                border-top: 1px solid rgba(255, 255, 255, 0.04);
            }
            .header-nav.open {
                display: flex;
            }
            .header-nav a {
                font-size: 13px;
                padding: 4px 12px;
            }
            .header-menu-toggle {
                display: block;
            }
            .header-search input {
                width: 120px;
            }
            .header-search {
                padding: 0 12px;
            }

            .main {
                padding: 16px 16px 40px;
            }

            .detail-hero {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 16px;
            }
            .detail-hero .poster {
                max-width: 200px;
                margin: 0 auto;
            }
            .detail-hero .info .title {
                font-size: 22px;
            }
            .detail-hero .info .title .original {
                font-size: 15px;
                display: block;
                margin-left: 0;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 14px;
            }
            .home-section .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .page-header h1 {
                font-size: 22px;
            }
            .player-section .player-controls {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }
            .player-section .episode-list {
                max-height: 100px;
                padding: 10px 16px 14px;
            }
        }

        @media (max-width: 480px) {
            .header-brand {
                font-size: 18px;
            }
            .header-brand i {
                font-size: 20px;
            }
            .header-search input {
                width: 80px;
                font-size: 13px;
            }

            .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
                gap: 10px;
            }
            .home-section .movie-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .movie-card .info h3 {
                font-size: 13px;
            }
            .movie-card .info .meta {
                font-size: 11px;
                flex-wrap: wrap;
            }

            .detail-hero .info .meta-row {
                font-size: 13px;
                gap: 6px 14px;
            }
            .pagination button {
                padding: 6px 12px;
                font-size: 13px;
                min-width: 34px;
            }
        }

        /* ============================================================
               UTILITY
            ============================================================ */
        .hidden {
            display: none !important;
        }
        .text-center {
            text-align: center;
        }
        .mt-8 {
            margin-top: 8px;
        }
        .mb-8 {
            margin-bottom: 8px;
        }
        .gap-4 {
            gap: 4px;
        }
        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flex-wrap {
            display: flex;
            flex-wrap: wrap;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--bg-card);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: var(--radius);
            padding: 14px 24px;
            box-shadow: var(--shadow);
            color: var(--text-primary);
            font-weight: 500;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: var(--transition);
            max-width: 400px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast.error {
            border-color: var(--accent);
        }
        .toast.error i {
            color: var(--accent);
            margin-right: 10px;
        }
        .toast.success i {
            color: #4caf50;
            margin-right: 10px;
        }
    </style>
</head>

<body>

    <!-- ============ LOADING ============ -->
    <div id="appLoading" class="app-loading">
        <div class="spinner"></div>
        <p>Đang tải ứng dụng...</p>

    <!-- ============ HEADER ============ -->
    <header class="header" id="appHeader">

            <i class="fas fa-film"></i>
            Phim<span>Hay</span>
        </a>

            <a href="#/" data-nav data-page="home">Trang chủ</a>
            <a href="#/category/phim-le" data-nav data-page="category">Phim lẻ</a>
            <a href="#/category/phim-bo" data-nav data-page="category">Phim bộ</a>

        <div class="header-search">

        </button>

    <!-- ============ MAIN ============ -->
    <main class="main" id="appMain">
        <!-- Nội dung được render bởi JS -->
    </main>

    <!-- ================================================================
    JAVASCRIPT
    ================================================================ -->
    <script>
        (function() {
            'use strict';

            // =============================================================
            // CONFIG
            // =============================================================
            const API_BASE = 'https://phimapi.com';
            const PAGE_SIZE = 20;

            // =============================================================
            // DOM refs
            // =============================================================
            const $ = (sel) => document.querySelector(sel);
            const $$ = (sel) => document.querySelectorAll(sel);

            const mainEl = $('#appMain');
            const loadingEl = $('#appLoading');
            const toastEl = $('#toast');
            const searchInput = $('#searchInput');
            const searchBtn = $('#searchBtn');
            const menuToggle = $('#menuToggle');
            const mainNav = $('#mainNav');

            let toastTimer = null;

            // =============================================================
            // TOAST
            // =============================================================
            function showToast(msg, type = 'info') {
                if (toastTimer) clearTimeout(toastTimer);
                const icon = type === 'error' ? 'fa-exclamation-circle' :
                    type === 'success' ? 'fa-check-circle' : 'fa-info-circle';
                toastEl.className = `toast ${type}`;
                toastEl.innerHTML = `<i class="fas ${icon}"></i> ${msg}`;
                toastEl.classList.add('show');
                toastTimer = setTimeout(() => toastEl.classList.remove('show'), 4000);
            }

            // =============================================================
            // API FETCH with retry & timeout
            // =============================================================
            async function fetchAPI(url, retries = 2) {
                for (let i = 0; i <= retries; i++) {
                    try {
                        const resp = await fetch(url, {
                            headers: { 'Accept': 'application/json' }
                        });
                        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                        const data = await resp.json();
                        if (data.status === 'error' || data.success === false) {
                            throw new Error(data.msg || 'API error');
                        }
                        return data;
                    } catch (err) {
                        if (i === retries) throw err;
                        await new Promise(r => setTimeout(r, 800 * (i + 1)));
                    }
                }
            }

            // =============================================================
            // ROUTER
            // =============================================================
            const routes = {};

            function navigate(hash) {
                if (!hash || hash === '#') hash = '#/';
                const path = hash.slice(1) || '/';
                window.location.hash = hash;
                renderRoute(path);
                // close mobile nav
                mainNav.classList.remove('open');
                // update nav active
                $$('.header-nav a[data-nav]').forEach(el => {
                    const page = el.dataset.page;
                    if (page === 'home' && path === '/') el.classList.add('active');
                    else if (page === 'category' && path.startsWith('/category/')) el.classList.add('active');
                    else if (page === 'genre' && path.startsWith('/genre/')) el.classList.add('active');
                    else if (page === 'country' && path.startsWith('/country/')) el.classList.add('active');
                    else if (page === 'year' && path.startsWith('/year/')) el.classList.add('active');
                    else if (page === 'movie' && path.startsWith('/movie/')) el.classList.add('active');
                    else if (page === 'search' && path.startsWith('/search/')) el.classList.add('active');
                    else el.classList.remove('active');
                });
                // sync search input
                const match = path.match(/^\/search\/(.+)/);
                if (match) {
                    searchInput.value = decodeURIComponent(match[1]);
                } else if (path === '/') {
                    // don't clear on home
                }
            }

            function renderRoute(path) {
                const parts = path.split('/').filter(Boolean);
                const first = parts[0] || '';

                // Home
                if (first === '' || first === 'home') {
                    renderHome();
                    return;
                }

                // Category: /category/:type
                if (first === 'category' && parts[1]) {
                    renderCategory(parts[1], getPageFromQuery());
                    return;
                }

                // Genre: /genre/:slug
                if (first === 'genre' && parts[1]) {
                    renderGenre(parts[1], getPageFromQuery());
                    return;
                }

                // Country: /country/:slug
                if (first === 'country' && parts[1]) {
                    renderCountry(parts[1], getPageFromQuery());
                    return;
                }

                // Year: /year/:year
                if (first === 'year' && parts[1]) {
                    renderYear(parts[1], getPageFromQuery());
                    return;
                }

                // Movie detail: /movie/:slug
                if (first === 'movie' && parts[1]) {
                    renderMovie(parts[1]);
                    return;
                }

                // Search: /search/:keyword
                if (first === 'search' && parts[1]) {
                    const keyword = decodeURIComponent(parts[1]);
                    renderSearch(keyword, getPageFromQuery());
                    return;
                }

                // 404
                renderNotFound();
            }

            function getPageFromQuery() {
                const hash = window.location.hash;
                const idx = hash.indexOf('?page=');
                if (idx === -1) return 1;
                const val = parseInt(hash.slice(idx + 6));
                return isNaN(val) || val < 1 ? 1 : val;
            }

            // =============================================================
            // RENDER: HOME
            // =============================================================
            async function renderHome() {
                setPageTitle('Trang chủ');
                showLoading(true);
                try {
                    const data = await fetchAPI(`${API_BASE}/v1/api/home`);
                    if (!data || !data.data) throw new Error('Không có dữ liệu');
                    const sections = data.data;

                    let html = '';
                    for (const [key, items] of Object.entries(sections)) {
                        if (!items || !items.length) continue;
                        const titleMap = {
                            'phim-moi-cap-nhat': '🔥 Phim mới cập nhật',
                            'phim-le': '🎬 Phim lẻ nổi bật',
                            'phim-bo': '📺 Phim bộ nổi bật',
                            'hoat-hinh': '🎨 Hoạt hình',
                            'tv-shows': '📺 TV Shows',
                            'phim-chieu-rap': '🎞️ Phim chiếu rạp',
                        };
                        const title = titleMap[key] || key.replace(/-/g, ' ').toUpperCase();
                        const viewAllLink = key === 'phim-le' ? '#/category/phim-le' :
                            key === 'phim-bo' ? '#/category/phim-bo' :
                            key === 'hoat-hinh' ? '#/category/hoat-hinh' :
                            key === 'tv-shows' ? '#/category/tv-shows' :
                            key === 'phim-chieu-rap' ? '#/category/phim-chieu-rap' : '#/';

                        html += `
                                <section class="home-section">
                                    <div class="section-header">
                                        <h2><i class="fas fa-chevron-right"></i>${title}</h2>
                                        <a href="${viewAllLink}" class="view-all">Xem tất cả →</a>
                                    </div>
                                    <div class="movie-grid">
                                        ${items.slice(0, 8).map(m => movieCardHTML(m)).join('')}
                                    </div>
                                </section>
                            `;
                    }
                    if (!html) html =
                    `<div class="no-results"><i class="fas fa-film"></i><h3>Không có phim</h3><p>Vui lòng thử lại sau.</p></div>`;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải trang chủ: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: CATEGORY
            // =============================================================
            async function renderCategory(type, page = 1) {
                const labelMap = {
                    'phim-le': 'Phim Lẻ',
                    'phim-bo': 'Phim Bộ',
                    'hoat-hinh': 'Hoạt Hình',
                    'tv-shows': 'TV Shows',
                    'phim-chieu-rap': 'Phim Chiếu Rạp'
                };
                const title = labelMap[type] || type.replace(/-/g, ' ').toUpperCase();
                setPageTitle(title);
                showLoading(true);

                try {
                    const url = `${API_BASE}/danh-sach/${type}?page=${page}`;
                    const data = await fetchAPI(url);
                    const items = data?.data?.items || data?.data || [];
                    const totalPages = data?.data?.totalPages || data?.data?.total_pages || 1;

                    if (!items.length) {
                        mainEl.innerHTML =
                        `<div class="no-results"><i class="fas fa-film"></i><h3>Không có phim</h3><p>Danh mục này chưa có phim.</p></div>`;
                        showLoading(false);
                        return;
                    }

                    let html = `
                            <div class="page">
                                <div class="page-header">
                                    <h1><i class="fas fa-list"></i>${title}</h1>
                                    <span class="badge">${items.length} phim</span>
                                </div>
                                <div class="movie-grid">
                                    ${items.map(m => movieCardHTML(m)).join('')}
                                </div>
                                ${paginationHTML(page, totalPages, `#/category/${type}`)}
                            </div>
                        `;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải danh mục: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: GENRE
            // =============================================================
            async function renderGenre(slug, page = 1) {
                setPageTitle('Thể loại: ' + slug.replace(/-/g, ' ').toUpperCase());
                showLoading(true);
                try {
                    const url = `${API_BASE}/v1/api/the-loai/${slug}?page=${page}`;
                    const data = await fetchAPI(url);
                    const items = data?.data?.items || data?.data || [];
                    const totalPages = data?.data?.totalPages || data?.data?.total_pages || 1;

                    if (!items.length) {
                        mainEl.innerHTML =
                        `<div class="no-results"><i class="fas fa-tags"></i><h3>Không có phim</h3><p>Thể loại này chưa có phim.</p></div>`;
                        showLoading(false);
                        return;
                    }

                    // Fetch genre list for filter bar
                    let genreList = [];
                    try {
                        const gData = await fetchAPI(`${API_BASE}/the-loai`);
                        genreList = gData?.data || gData || [];
                    } catch (_) { /* ignore */ }

                    let html = `
                            <div class="page">
                                <div class="page-header">
                                    <h1><i class="fas fa-tags"></i>${slug.replace(/-/g, ' ').toUpperCase()}</h1>
                                    <span class="badge">${items.length} phim</span>
                                </div>
                                ${genreList.length ? filterBarHTML(genreList, 'genre', slug) : ''}
                                <div class="movie-grid">
                                    ${items.map(m => movieCardHTML(m)).join('')}
                                </div>
                                ${paginationHTML(page, totalPages, `#/genre/${slug}`)}
                            </div>
                        `;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải thể loại: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: COUNTRY
            // =============================================================
            async function renderCountry(slug, page = 1) {
                setPageTitle('Quốc gia: ' + slug.replace(/-/g, ' ').toUpperCase());
                showLoading(true);
                try {
                    const url = `${API_BASE}/v1/api/quoc-gia/${slug}?page=${page}`;
                    const data = await fetchAPI(url);
                    const items = data?.data?.items || data?.data || [];
                    const totalPages = data?.data?.totalPages || data?.data?.total_pages || 1;

                    if (!items.length) {
                        mainEl.innerHTML =
                        `<div class="no-results"><i class="fas fa-globe"></i><h3>Không có phim</h3><p>Quốc gia này chưa có phim.</p></div>`;
                        showLoading(false);
                        return;
                    }

                    let countryList = [];
                    try {
                        const cData = await fetchAPI(`${API_BASE}/quoc-gia`);
                        countryList = cData?.data || cData || [];
                    } catch (_) { /* ignore */ }

                    let html = `
                            <div class="page">
                                <div class="page-header">
                                    <h1><i class="fas fa-globe"></i>${slug.replace(/-/g, ' ').toUpperCase()}</h1>
                                    <span class="badge">${items.length} phim</span>
                                </div>
                                ${countryList.length ? filterBarHTML(countryList, 'country', slug) : ''}
                                <div class="movie-grid">
                                    ${items.map(m => movieCardHTML(m)).join('')}
                                </div>
                                ${paginationHTML(page, totalPages, `#/country/${slug}`)}
                            </div>
                        `;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải quốc gia: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: YEAR
            // =============================================================
            async function renderYear(year, page = 1) {
                setPageTitle('Năm: ' + year);
                showLoading(true);
                try {
                    const url = `${API_BASE}/v1/api/nam/${year}?page=${page}`;
                    const data = await fetchAPI(url);
                    const items = data?.data?.items || data?.data || [];
                    const totalPages = data?.data?.totalPages || data?.data?.total_pages || 1;

                    if (!items.length) {
                        mainEl.innerHTML =
                        `<div class="no-results"><i class="fas fa-calendar"></i><h3>Không có phim</h3><p>Năm ${year} chưa có phim.</p></div>`;
                        showLoading(false);
                        return;
                    }

                    let yearList = [];
                    try {
                        const yData = await fetchAPI(`${API_BASE}/nam-phat-hanh`);
                        yearList = yData?.data || yData || [];
                    } catch (_) { /* ignore */ }

                    let html = `
                            <div class="page">
                                <div class="page-header">
                                    <h1><i class="fas fa-calendar"></i>Phim ${year}</h1>
                                    <span class="badge">${items.length} phim</span>
                                </div>
                                ${yearList.length ? filterBarHTML(yearList, 'year', year) : ''}
                                <div class="movie-grid">
                                    ${items.map(m => movieCardHTML(m)).join('')}
                                </div>
                                ${paginationHTML(page, totalPages, `#/year/${year}`)}
                            </div>
                        `;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải dữ liệu</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải năm: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: MOVIE DETAIL
            // =============================================================
            async function renderMovie(slug) {
                setPageTitle('Đang tải phim...');
                showLoading(true);
                try {
                    const data = await fetchAPI(`${API_BASE}/phim/${slug}`);
                    const movie = data?.data || data;
                    if (!movie) throw new Error('Không tìm thấy phim');

                    const title = movie.name || movie.title || slug;
                    setPageTitle(title);

                    // Extract episodes
                    let episodes = [];
                    let servers = [];
                    if (movie.episodes && movie.episodes.length) {
                        // Group by server
                        movie.episodes.forEach(server => {
                            const serverName = server.server_name || 'Server';
                            const eps = (server.server_data || []).map(e => ({
                                name: e.name || e.title || 'Tập',
                                link: e.link || e.url || '',
                                slug: e.slug || ''
                            })).filter(e => e.link);
                            if (eps.length) {
                                servers.push({ name: serverName, episodes: eps });
                                episodes = episodes.concat(eps);
                            }
                        });
                    }

                    // Also check for direct episode list
                    if (!episodes.length && movie.episode) {
                        const eps = Array.isArray(movie.episode) ? movie.episode : [movie.episode];
                        episodes = eps.map(e => ({
                            name: e.name || e.title || 'Tập 1',
                            link: e.link || e.url || '',
                            slug: e.slug || ''
                        })).filter(e => e.link);
                        if (episodes.length) {
                            servers.push({ name: 'Server 1', episodes });
                        }
                    }

                    // Fallback: if still no episodes, try to use the movie's link
                    if (!episodes.length && movie.link) {
                        episodes = [{ name: 'Xem phim', link: movie.link, slug: '' }];
                        servers.push({ name: 'Server 1', episodes });
                    }

                    const poster = movie.poster || movie.thumb_url || '';
                    const year = movie.year || movie.release_year || '';
                    const rating = movie.rating || movie.imdb_score || '';
                    const duration = movie.duration || movie.time || '';
                    const quality = movie.quality || movie.quality_text || '';
                    const lang = movie.language || movie.lang || '';

                    const genres = movie.genre || movie.categories || [];
                    const genreNames = Array.isArray(genres) ? genres.map(g => g.name || g).filter(Boolean) : [];

                    const countryNames = movie.country || movie.countries || [];
                    const countryList = Array.isArray(countryNames) ? countryNames.map(c => c.name || c).filter(Boolean) : [];

                    const desc = movie.content || movie.description || movie.overview || 'Chưa có mô tả.';

                    // Build HTML
                    let html = `
                            <div class="page">
                                <div class="detail-hero">
                                    <div class="poster">
                                        <img src="${poster}" alt="${title}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22 fill=%22%231a1a30%22%3E%3Crect width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236a6a82%22 font-family=%22Inter%22 font-size=%2216%22%3ENo image%3C/text%3E%3C/svg%3E'" />
                                    </div>
                                    <div class="info">
                                        <h1 class="title">
                                            ${title}
                                            ${movie.origin_name ? `<span class="original">${movie.origin_name}</span>` : ''}
                                        </h1>
                                        <div class="meta-row">
                                            ${year ? `<span><span class="label">Năm:</span> <span class="value">${year}</span></span>` : ''}
                                            ${rating ? `<span><span class="label">Đánh giá:</span> <span class="value rating"><i class="fas fa-star"></i> ${rating}</span></span>` : ''}
                                            ${duration ? `<span><span class="label">Thời lượng:</span> <span class="value">${duration}</span></span>` : ''}
                                            ${quality ? `<span><span class="label">Chất lượng:</span> <span class="value">${quality}</span></span>` : ''}
                                            ${lang ? `<span><span class="label">Ngôn ngữ:</span> <span class="value">${lang}</span></span>` : ''}
                                        </div>
                                        ${genreNames.length ? `<div class="genres">${genreNames.map(g => `<span class="tag">${g}</span>`).join('')}</div>` : ''}
                                        ${countryList.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--text-secondary);"><span class="label">Quốc gia:</span> ${countryList.map(c => `<span class="tag">${c}</span>`).join('')}</div>` : ''}
                                        <div class="description" id="movieDesc">${desc}</div>
                                        ${desc.length > 300 ? `<span class="read-more" id="descToggle">Xem thêm</span>` : ''}
                                    </div>
                                </div>
                            `;

                    // Player section
                    html += `
                                <div class="player-section" id="playerSection">
                                    <div class="player-wrapper">
                                        <video id="videoPlayer" controls playsinline></video>
                                        <div class="player-placeholder" id="playerPlaceholder">
                                            <i class="fas fa-play-circle"></i>
                                            <p>Chọn tập để xem</p>
                                        </div>
                                    </div>
                                    ${servers.length > 1 ? `
                                        <div class="player-controls">
                                            <div class="server-select">
                                                <label><i class="fas fa-server"></i> Server:</label>
                                                <select id="serverSelect">
                                                    ${servers.map((s, i) => `<option value="${i}">${s.name}</option>`).join('')}
                                                </select>
                                            </div>
                                            <div style="font-size:13px;color:var(--text-secondary);">
                                                <i class="fas fa-info-circle"></i> Chọn tập bên dưới
                                            </div>
                                        </div>
                                    ` : ''}
                                    ${episodes.length > 1 ? `
                                        <div class="episode-list" id="episodeList">
                                            ${episodes.map((e, i) => `
                                                <button class="ep-btn ${i === 0 ? 'active' : ''}" data-index="${i}" data-link="${e.link}">
                                                    ${e.name}
                                                </button>
                                            `).join('')}
                                        </div>
                                    ` : episodes.length === 1 ? `
                                        <div class="episode-list" id="episodeList" style="justify-content:center;padding:8px 20px;">
                                            <button class="ep-btn active" data-index="0" data-link="${episodes[0].link}">
                                                ${episodes[0].name}
                                            </button>
                                        </div>
                                    ` : `
                                        <div class="episode-list" id="episodeList" style="justify-content:center;padding:8px 20px;color:var(--text-muted);">
                                            <i class="fas fa-exclamation-circle"></i> Không có tập nào
                                        </div>
                                    `}
                                </div>
                            `;

                    html += `</div>`;
                    mainEl.innerHTML = html;

                    // --- Setup player ---
                    setupPlayer(episodes);

                    // --- Description toggle ---
                    const descToggle = document.getElementById('descToggle');
                    if (descToggle) {
                        descToggle.addEventListener('click', () => {
                            const desc = document.getElementById('movieDesc');
                            desc.classList.toggle('expanded');
                            descToggle.textContent = desc.classList.contains('expanded') ? 'Thu gọn' : 'Xem thêm';
                        });
                    }

                    // --- Server select ---
                    const serverSelect = document.getElementById('serverSelect');
                    if (serverSelect) {
                        serverSelect.addEventListener('change', () => {
                            const idx = parseInt(serverSelect.value);
                            const server = servers[idx];
                            if (server && server.episodes.length) {
                                const eps = server.episodes;
                                const list = document.getElementById('episodeList');
                                if (list) {
                                    list.innerHTML = eps.map((e, i) => `
                                            <button class="ep-btn ${i === 0 ? 'active' : ''}" data-index="${i}" data-link="${e.link}">
                                                ${e.name}
                                            </button>
                                        `).join('');
                                    // Re-bind clicks
                                    list.querySelectorAll('.ep-btn').forEach(btn => {
                                        btn.addEventListener('click', () => {
                                            list.querySelectorAll('.ep-btn').forEach(b => b.classList.remove(
                                            'active'));
                                            btn.classList.add('active');
                                            const link = btn.dataset.link;
                                            playM3U8(link);
                                        });
                                    });
                                    // Auto-play first
                                    const first = eps[0];
                                    if (first) playM3U8(first.link);
                                }
                            }
                        });
                    }

                    // --- Episode clicks ---
                    document.querySelectorAll('#episodeList .ep-btn').forEach(btn => {
                        btn.addEventListener('click', () => {
                            document.querySelectorAll('#episodeList .ep-btn').forEach(b => b.classList.remove(
                            'active'));
                            btn.classList.add('active');
                            const link = btn.dataset.link;
                            playM3U8(link);
                        });
                    });

                    // Auto-play first episode
                    if (episodes.length) {
                        playM3U8(episodes[0].link);
                    }

                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tải phim</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tải phim: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // PLAYER
            // =============================================================
            let hlsInstance = null;
            let videoEl = null;

            function setupPlayer(episodes) {
                videoEl = document.getElementById('videoPlayer');
                const placeholder = document.getElementById('playerPlaceholder');
                if (videoEl) {
                    videoEl.style.display = 'none';
                    if (placeholder) placeholder.style.display = 'flex';
                }
                // Destroy old HLS
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }
            }

            function playM3U8(url) {
                if (!url) {
                    showToast('Link phim không hợp lệ', 'error');
                    return;
                }
                const video = document.getElementById('videoPlayer');
                const placeholder = document.getElementById('playerPlaceholder');
                if (!video) return;

                // Clean up old HLS
                if (hlsInstance) {
                    hlsInstance.destroy();
                    hlsInstance = null;
                }

                // Check if it's a direct m3u8
                if (url.includes('.m3u8') || url.includes('m3u8')) {
                    if (Hls.isSupported()) {
                        hlsInstance = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            backbufferLength: 30,
                        });
                        hlsInstance.loadSource(url);
                        hlsInstance.attachMedia(video);
                        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                            video.style.display = 'block';
                            if (placeholder) placeholder.style.display = 'none';
                            video.play().catch(() => {});
                        });
                        hlsInstance.on(Hls.Events.ERROR, (_, data) => {
                            if (data.fatal) {
                                showToast('Lỗi phát video, thử lại...', 'error');
                                // Try fallback: direct play
                                fallbackPlay(url, video, placeholder);
                            }
                        });
                    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                        // Safari native HLS
                        video.src = url;
                        video.style.display = 'block';
                        if (placeholder) placeholder.style.display = 'none';
                        video.play().catch(() => {});
                    } else {
                        showToast('Trình duyệt không hỗ trợ phát HLS', 'error');
                        fallbackPlay(url, video, placeholder);
                    }
                } else {
                    // Not m3u8 - try direct play or embed
                    fallbackPlay(url, video, placeholder);
                }
            }

            function fallbackPlay(url, video, placeholder) {
                // Try to play directly
                video.src = url;
                video.style.display = 'block';
                if (placeholder) placeholder.style.display = 'none';
                video.play().catch(() => {
                    // If it fails, show a message with the link
                    showToast('Không thể phát trực tiếp. Kiểm tra link: ' + url.substring(0, 60) + '...', 'error');
                    if (placeholder) {
                        placeholder.style.display = 'flex';
                        placeholder.innerHTML = `
                                <i class="fas fa-exclamation-triangle" style="color:var(--accent);"></i>
                                <p>Không thể phát video</p>
                                <a href="${url}" target="_blank" style="color:var(--accent);font-size:13px;text-decoration:underline;">Mở link trực tiếp</a>
                            `;
                    }
                });
            }

            // =============================================================
            // RENDER: SEARCH
            // =============================================================
            async function renderSearch(keyword, page = 1) {
                setPageTitle('Tìm kiếm: ' + keyword);
                showLoading(true);
                try {
                    const url = `${API_BASE}/v1/api/tim-kiem?keyword=${encodeURIComponent(keyword)}&page=${page}`;
                    const data = await fetchAPI(url);
                    const items = data?.data?.items || data?.data || [];
                    const totalPages = data?.data?.totalPages || data?.data?.total_pages || 1;
                    const total = data?.data?.total || data?.data?.totalItems || items.length;

                    let html = `
                            <div class="page">
                                <div class="page-header">
                                    <h1><i class="fas fa-search"></i>Kết quả tìm kiếm</h1>
                                    <span class="badge">${total} phim</span>
                                </div>
                                <div class="search-stats">
                                    Từ khóa: <strong>"${keyword}"</strong> · ${total} kết quả
                                </div>
                        `;

                    if (!items.length) {
                        html += `
                                <div class="no-results">
                                    <i class="fas fa-search"></i>
                                    <h3>Không tìm thấy phim</h3>
                                    <p>Thử tìm kiếm với từ khóa khác.</p>
                                </div>
                            `;
                    } else {
                        html += `
                                <div class="movie-grid">
                                    ${items.map(m => movieCardHTML(m)).join('')}
                                </div>
                                ${paginationHTML(page, totalPages, `#/search/${encodeURIComponent(keyword)}`)}
                            `;
                    }

                    html += `</div>`;
                    mainEl.innerHTML = html;
                } catch (err) {
                    mainEl.innerHTML =
                    `<div class="no-results"><i class="fas fa-exclamation-triangle"></i><h3>Lỗi tìm kiếm</h3><p>${err.message}</p></div>`;
                    showToast('Lỗi tìm kiếm: ' + err.message, 'error');
                }
                showLoading(false);
            }

            // =============================================================
            // RENDER: NOT FOUND
            // =============================================================
            function renderNotFound() {
                setPageTitle('404');
                mainEl.innerHTML = `
                        <div class="no-results" style="padding:80px 20px;">
                            <i class="fas fa-exclamation-triangle" style="font-size:64px;"></i>
                            <h3>Trang không tồn tại</h3>
                            <p>Đường dẫn bạn truy cập không có trong hệ thống.</p>
                            <a href="#/" style="display:inline-block;margin-top:16px;padding:8px 28px;background:var(--accent);border-radius:30px;font-weight:600;">Về trang chủ</a>
                        </div>
                    `;
            }

            // =============================================================
            // HELPERS: HTML generators
            // =============================================================

            function movieCardHTML(m) {
                const slug = m.slug || m.id || '';
                const title = m.name || m.title || 'Không tên';
                const poster = m.poster || m.thumb_url || '';
                const year = m.year || m.release_year || '';
                const rating = m.rating || m.imdb_score || '';
                const episodeCurrent = m.episode_current || m.episode || '';
                const quality = m.quality || '';

                const hasEp = episodeCurrent && episodeCurrent !== '0';
                const epLabel = hasEp ? episodeCurrent : '';

                return `
                        <div class="movie-card" data-slug="${slug}" onclick="window.navigateToMovie('${slug}')">
                            <div class="poster">
                                <img src="${poster}" alt="${title}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22 fill=%22%231a1a30%22%3E%3Crect width=%22300%22 height=%22450%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%236a6a82%22 font-family=%22Inter%22 font-size=%2216%22%3ENo image%3C/text%3E%3C/svg%3E'" />
                                <div class="overlay"><i class="fas fa-play"></i></div>
                                ${epLabel ? `<span class="episode-badge">${epLabel}</span>` : ''}
                                ${quality ? `<span class="quality-badge">${quality}</span>` : ''}
                            </div>
                            <div class="info">
                                <h3>${title}</h3>
                                <div class="meta">
                                    ${year ? `<span class="year">${year}</span>` : ''}
                                    ${rating ? `<span class="rating"><i class="fas fa-star"></i> ${rating}</span>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
            }

            function paginationHTML(current, total, baseUrl) {
                if (total <= 1) return '';
                const maxShow = 7;
                let html = `<div class="pagination">`;
                html +=
                    `<button onclick="window.navigatePage('${baseUrl}', ${current - 1})" ${current <= 1 ? 'disabled' : ''}><i class="fas fa-chevron-left"></i></button>`;

                let start = Math.max(1, current - Math.floor(maxShow / 2));
                let end = Math.min(total, start + maxShow - 1);
                if (end - start < maxShow - 1) start = Math.max(1, end - maxShow + 1);

                if (start > 1) {
                    html += `<button onclick="window.navigatePage('${baseUrl}', 1)">1</button>`;
                    if (start > 2) html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
                }
                for (let i = start; i <= end; i++) {
                    html +=
                        `<button onclick="window.navigatePage('${baseUrl}', ${i})" class="${i === current ? 'active' : ''}">${i}</button>`;
                }
                if (end < total) {
                    if (end < total - 1) html += `<span style="color:var(--text-muted);padding:0 4px;">…</span>`;
                    html += `<button onclick="window.navigatePage('${baseUrl}', ${total})">${total}</button>`;
                }

                html +=
                    `<button onclick="window.navigatePage('${baseUrl}', ${current + 1})" ${current >= total ? 'disabled' : ''}><i class="fas fa-chevron-right"></i></button>`;
                html += `</div>`;
                return html;
            }

            function filterBarHTML(items, type, activeSlug) {
                let html = `<div class="filter-bar"><span class="filter-label"><i class="fas fa-filter"></i></span>`;
                const baseMap = {
                    genre: '#/genre/',
                    country: '#/country/',
                    year: '#/year/'
                };
                const base = baseMap[type] || '#/';
                items.forEach(item => {
                    const slug = typeof item === 'string' ? item : (item.slug || item.name || item);
                    const label = typeof item === 'string' ? item : (item.name || item.title || item);
                    const isActive = slug === activeSlug || label === activeSlug;
                    html +=
                        `<a href="${base}${encodeURIComponent(slug)}" class="filter-tag ${isActive ? 'active' : ''}">${label}</a>`;
                });
                html += `</div>`;
                return html;
            }

            // =============================================================
            // NAVIGATION HELPERS (exposed to global)
            // =============================================================
            window.navigateToMovie = function(slug) {
                if (slug) window.location.hash = `#/movie/${slug}`;
            };

            window.navigatePage = function(baseUrl, page) {
                if (page < 1) return;
                const hash = baseUrl.startsWith('#') ? baseUrl : '#' + baseUrl;
                const hasQuery = hash.includes('?');
                window.location.hash = `${hash}${hasQuery ? '&' : '?'}page=${page}`;
            };

            // =============================================================
            // UI HELPERS
            // =============================================================
            function setPageTitle(title) {
                document.title = title + ' - Phim Hay';
            }

            function showLoading(show) {
                if (show) {
                    loadingEl.classList.remove('hidden');
                } else {
                    loadingEl.classList.add('hidden');
                }
            }

            // =============================================================
            // EVENT BINDING
            // =============================================================

            // Hash change
            window.addEventListener('hashchange', () => {
                navigate(window.location.hash);
            });

            // Search
            function doSearch() {
                const kw = searchInput.value.trim();
                if (!kw) {
                    showToast('Vui lòng nhập từ khóa tìm kiếm', 'error');
                    return;
                }
                window.location.hash = `#/search/${encodeURIComponent(kw)}`;
            }

            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') doSearch();
            });

            // Menu toggle
            menuToggle.addEventListener('click', () => {
                mainNav.classList.toggle('open');
            });

            // Click outside to close nav
            document.addEventListener('click', (e) => {
                if (!e.target.closest('.header') && mainNav.classList.contains('open')) {
                    mainNav.classList.remove('open');
                }
            });

            // Nav links - just let hash change work
            document.querySelectorAll('.header-nav a[data-nav]').forEach(el => {
                el.addEventListener('click', (e) => {
                    // let default behavior handle hash
                });
            });

            // =============================================================
            // BOOT
            // =============================================================
            function boot() {
                showLoading(true);
                // Start with current hash or default
                const hash = window.location.hash || '#/';
                navigate(hash);
                // Hide loading after a moment
                setTimeout(() => showLoading(false), 600);
            }

            // If the page loads with no hash, set one
            if (!window.location.hash || window.location.hash === '#') {
                window.location.hash = '#/';
            }

            // Handle direct clicks on movie cards (delegated)
            document.addEventListener('click', (e) => {
                const card = e.target.closest('.movie-card');
                if (card && card.dataset.slug) {
                    e.preventDefault();
                    window.navigateToMovie(card.dataset.slug);
                }
            });

            // Boot the app
            boot();

            console.log('🍿 Phim Hay app loaded!');
            console.log('📌 API Base:', API_BASE);
            console.log('🔗 Navigate with #/category/phim-le, #/movie/slug, #/search/keyword');

        })();
    </script>

</body>
