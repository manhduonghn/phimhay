<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PhimHay - Xem Phim Online Miễn Phí</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #e50914;
            --primary-hover: #f40612;
            --bg: #0f0f0f;
            --bg-secondary: #1a1a1a;
            --bg-card: #1f1f1f;
            --bg-hover: #2a2a2a;
            --text: #ffffff;
            --text-secondary: #b3b3b3;
            --text-muted: #666666;
            --border: #333333;
            --gradient: linear-gradient(135deg, #e50914 0%, #b20710 100%);
            --shadow: 0 4px 20px rgba(0,0,0,0.5);
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        /* Header */
        .header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
            background: rgba(15, 15, 15, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: var(--transition);
        }
        .header.scrolled {
            background: rgba(15, 15, 15, 0.98);
            box-shadow: 0 2px 30px rgba(0,0,0,0.5);
        }
        .header-inner {
            max-width: 1400px; margin: 0 auto; padding: 0 24px;
            height: 70px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .logo {
            display: flex; align-items: center; gap: 10px;
            text-decoration: none; color: var(--text);
            font-size: 24px; font-weight: 800; letter-spacing: -0.5px; flex-shrink: 0;
        }
        .logo i { color: var(--primary); font-size: 28px; }
        .logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav {
            display: flex; align-items: center; gap: 4px;
            overflow-x: auto; scrollbar-width: none;
        }
        .nav::-webkit-scrollbar { display: none; }
        .nav-btn {
            padding: 8px 14px; border: none; background: transparent;
            color: var(--text-secondary); font-size: 13px; font-weight: 500;
            border-radius: 8px; cursor: pointer; transition: var(--transition);
            white-space: nowrap; font-family: inherit;
        }
        .nav-btn:hover, .nav-btn.active {
            color: var(--text); background: var(--bg-hover);
        }
        .nav-btn.active {
            background: var(--primary); color: white;
        }

        .search-box {
            position: relative; width: 260px; flex-shrink: 0;
        }
        .search-box input {
            width: 100%; padding: 10px 40px 10px 16px;
            border: 1px solid var(--border); border-radius: 10px;
            background: var(--bg-secondary); color: var(--text);
            font-size: 14px; font-family: inherit; transition: var(--transition);
        }
        .search-box input:focus {
            outline: none; border-color: var(--primary); background: var(--bg-card);
        }
        .search-box input::placeholder { color: var(--text-muted); }
        .search-box button {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: var(--text-muted);
            cursor: pointer; padding: 6px; font-size: 16px;
        }

        .mobile-menu-btn {
            display: none; background: none; border: none;
            color: var(--text); font-size: 24px; cursor: pointer;
        }

        /* Main */
        .main { margin-top: 70px; min-height: calc(100vh - 70px); }

        /* Hero */
        .hero {
            position: relative; height: 500px; overflow: hidden;
            display: flex; align-items: flex-end;
        }
        .hero-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: brightness(0.4);
            transition: transform 8s ease;
        }
        .hero:hover .hero-bg { transform: scale(1.05); }
        .hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg) 0%, transparent 60%, rgba(0,0,0,0.5) 100%);
        }
        .hero-content {
            position: relative; z-index: 2;
            max-width: 1400px; width: 100%; margin: 0 auto; padding: 40px 24px;
        }
        .hero-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 6px 14px; background: var(--gradient);
            border-radius: 20px; font-size: 12px; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 16px;
        }
        .hero-title {
            font-size: 48px; font-weight: 800; line-height: 1.1;
            margin-bottom: 12px; max-width: 700px;
            text-shadow: 0 2px 20px rgba(0,0,0,0.5);
        }
        .hero-meta {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 20px; flex-wrap: wrap;
        }
        .hero-meta span {
            display: flex; align-items: center; gap: 6px;
            font-size: 14px; color: var(--text-secondary);
        }
        .hero-meta .rating { color: #f5c518; font-weight: 600; }
        .hero-meta .tag {
            padding: 4px 12px; background: rgba(255,255,255,0.1);
            border-radius: 6px; font-size: 13px;
        }
        .hero-desc {
            font-size: 16px; color: var(--text-secondary);
            max-width: 600px; line-height: 1.6; margin-bottom: 24px;
            display: -webkit-box; -webkit-line-clamp: 3;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .hero-buttons { display: flex; gap: 12px; flex-wrap: wrap; }

        .btn {
            padding: 12px 28px; border-radius: 8px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: var(--transition); border: none;
            display: inline-flex; align-items: center; gap: 8px;
            font-family: inherit; text-decoration: none;
        }
        .btn-primary {
            background: var(--gradient); color: white;
            box-shadow: 0 4px 15px rgba(229, 9, 20, 0.4);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(229, 9, 20, 0.6);
        }
        .btn-secondary {
            background: rgba(255,255,255,0.1); color: var(--text);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.2); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }

        /* Section */
        .section {
            max-width: 1400px; margin: 0 auto; padding: 40px 24px;
        }
        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; flex-wrap: wrap; gap: 12px;
        }
        .section-title {
            font-size: 24px; font-weight: 700;
            display: flex; align-items: center; gap: 10px;
        }
        .section-title i { color: var(--primary); }
        .result-count {
            color: var(--text-muted); font-size: 14px;
        }

        /* Category Grid */
        .category-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 16px;
        }
        .category-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            text-decoration: none;
            color: var(--text);
        }
        .category-card:hover {
            border-color: var(--primary);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(229, 9, 20, 0.2);
        }
        .category-card i {
            font-size: 32px; color: var(--primary);
            margin-bottom: 12px; display: block;
        }
        .category-card .name {
            font-size: 15px; font-weight: 600;
            margin-bottom: 4px;
        }
        .category-card .count {
            font-size: 12px; color: var(--text-muted);
        }

        /* Movie Grid */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .movie-card {
            position: relative; border-radius: var(--radius);
            overflow: hidden; background: var(--bg-card);
            cursor: pointer; transition: var(--transition);
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        .movie-poster {
            position: relative; aspect-ratio: 2/3; overflow: hidden;
        }
        .movie-poster img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.5s ease;
        }
        .movie-card:hover .movie-poster img { transform: scale(1.1); }
        .movie-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, transparent 50%);
            opacity: 0; transition: opacity 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .movie-card:hover .movie-overlay { opacity: 1; }
        .play-btn {
            width: 60px; height: 60px; border-radius: 50%;
            background: var(--gradient);
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 24px;
            transform: scale(0.8); transition: transform 0.3s ease;
            box-shadow: 0 4px 20px rgba(229, 9, 20, 0.5);
        }
        .movie-card:hover .play-btn { transform: scale(1); }
        .movie-badge {
            position: absolute; top: 10px; left: 10px;
            padding: 4px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
        }
        .badge-quality { background: var(--gradient); color: white; }
        .badge-episode {
            background: rgba(0,0,0,0.8); color: white;
            backdrop-filter: blur(10px);
        }
        .badge-lang {
            position: absolute; top: 10px; right: 10px;
            padding: 4px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 600;
            background: rgba(229, 9, 20, 0.9); color: white;
        }
        .movie-info { padding: 14px; }
        .movie-name {
            font-size: 14px; font-weight: 600; line-height: 1.4;
            margin-bottom: 6px;
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            min-height: 40px;
        }
        .movie-meta {
            display: flex; align-items: center; justify-content: space-between;
            font-size: 12px; color: var(--text-muted);
        }
        .movie-meta span {
            display: flex; align-items: center; gap: 4px;
        }

        /* Loading */
        .loading {
            display: flex; align-items: center; justify-content: center;
            padding: 60px; gap: 8px;
        }
        .loading-spinner {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--primary); border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .skeleton-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
        }
        .skeleton-card {
            background: var(--bg-card); border-radius: var(--radius); overflow: hidden;
        }
        .skeleton-poster {
            aspect-ratio: 2/3;
            background: linear-gradient(90deg, var(--bg-secondary) 25%, var(--bg-hover) 50%, var(--bg-secondary) 75%);
            background-size: 200% 100%; animation: shimmer 1.5s infinite;
        }
        .skeleton-info { padding: 14px; }
        .skeleton-line {
            height: 14px; background: var(--bg-secondary);
            border-radius: 4px; margin-bottom: 8px;
            animation: shimmer 1.5s infinite;
        }
        .skeleton-line.short { width: 60%; }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Pagination */
        .pagination {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; margin-top: 40px; flex-wrap: wrap;
        }
        .page-btn {
            min-width: 40px; height: 40px; padding: 0 12px;
            border: 1px solid var(--border); background: var(--bg-card);
            color: var(--text-secondary); border-radius: 8px;
            cursor: pointer; font-size: 14px; font-weight: 500;
            font-family: inherit; transition: var(--transition);
            display: flex; align-items: center; justify-content: center;
        }
        .page-btn:hover { border-color: var(--primary); color: var(--text); }
        .page-btn.active {
            background: var(--gradient); border-color: var(--primary); color: white;
        }
        .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Modal */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.92);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            opacity: 0; visibility: hidden;
            transition: all 0.3s ease;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: var(--bg-secondary);
            border-radius: var(--radius);
            width: 100%; max-width: 1200px;
            max-height: 95vh;
            overflow-y: auto;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.3s ease;
            position: relative;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-close {
            position: absolute; top: 16px; right: 16px;
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(0,0,0,0.7); border: none;
            color: white; font-size: 20px; cursor: pointer;
            z-index: 10; display: flex; align-items: center; justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: var(--primary); transform: rotate(90deg); }

        /* Video Player */
        .video-wrapper {
            position: relative; width: 100%;
            background: #000; border-radius: var(--radius);
            overflow: hidden; margin-bottom: 20px;
        }
        .video-wrapper video {
            width: 100%; display: block;
        }
        .video-placeholder {
            aspect-ratio: 16/9;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; color: var(--text-secondary);
        }
        .video-placeholder i { font-size: 64px; color: var(--primary); }

        /* Detail View */
        .detail-hero {
            position: relative; min-height: 350px;
            overflow: hidden; display: flex; align-items: flex-end;
        }
        .detail-hero-bg {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            filter: brightness(0.25) blur(3px);
        }
        .detail-hero-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, var(--bg-secondary) 0%, transparent 70%);
        }
        .detail-hero-content {
            position: relative; z-index: 2;
            display: flex; gap: 30px; padding: 40px;
            align-items: flex-end;
        }
        .detail-poster {
            width: 180px; border-radius: var(--radius);
            overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            flex-shrink: 0;
        }
        .detail-poster img { width: 100%; display: block; }
        .detail-info { flex: 1; padding-bottom: 10px; }
        .detail-title { font-size: 32px; font-weight: 800; margin-bottom: 6px; line-height: 1.2; }
        .detail-origin { font-size: 15px; color: var(--text-secondary); margin-bottom: 14px; }
        .detail-meta {
            display: flex; align-items: center; gap: 12px;
            margin-bottom: 16px; flex-wrap: wrap;
        }
        .detail-meta span {
            display: flex; align-items: center; gap: 6px; font-size: 14px;
        }
        .detail-meta .tag {
            padding: 4px 12px; background: rgba(255,255,255,0.1);
            border-radius: 6px; font-size: 13px;
        }
        .detail-actions { display: flex; gap: 12px; flex-wrap: wrap; }
        .detail-body { padding: 0 40px 40px; }
        .detail-section { margin-bottom: 28px; }
        .detail-section-title {
            font-size: 18px; font-weight: 700; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .detail-content {
            color: var(--text-secondary); line-height: 1.8; font-size: 15px;
        }
        .detail-content p { margin-bottom: 12px; }
        .cast-list {
            display: flex; gap: 10px; flex-wrap: wrap;
        }
        .cast-item {
            padding: 8px 14px; background: var(--bg-card);
            border-radius: 8px; font-size: 14px;
            display: flex; align-items: center; gap: 8px;
            border: 1px solid var(--border);
        }
        .cast-item i { color: var(--primary); }

        /* Server & Episode */
        .server-tabs {
            display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
        }
        .server-tab {
            padding: 10px 18px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text-secondary); cursor: pointer;
            font-size: 14px; font-weight: 500; font-family: inherit;
            transition: var(--transition);
        }
        .server-tab:hover { border-color: var(--primary); color: var(--text); }
        .server-tab.active {
            background: var(--gradient); border-color: var(--primary); color: white;
        }
        .episode-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
        }
        .episode-btn {
            padding: 10px; background: var(--bg-card);
            border: 1px solid var(--border); border-radius: 8px;
            color: var(--text); cursor: pointer;
            font-size: 13px; font-weight: 500; font-family: inherit;
            transition: var(--transition); text-align: center;
        }
        .episode-btn:hover { border-color: var(--primary); background: var(--bg-hover); }
        .episode-btn.active { background: var(--gradient); border-color: var(--primary); }

        /* Breadcrumb */
        .breadcrumb {
            display: flex; align-items: center; gap: 8px;
            margin-bottom: 20px; font-size: 14px; color: var(--text-muted);
            flex-wrap: wrap;
        }
        .breadcrumb a {
            color: var(--text-secondary); text-decoration: none;
            transition: var(--transition);
        }
        .breadcrumb a:hover { color: var(--primary); }
        .breadcrumb i { font-size: 10px; }

        /* Footer */
        .footer {
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            padding: 40px 24px; margin-top: 60px;
        }
        .footer-inner {
            max-width: 1400px; margin: 0 auto; text-align: center;
        }
        .footer-logo { font-size: 24px; font-weight: 800; margin-bottom: 16px; }
        .footer-logo span {
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .footer-text {
            color: var(--text-muted); font-size: 14px;
            max-width: 600px; margin: 0 auto;
        }

        /* Toast */
        .toast {
            position: fixed; bottom: 30px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card); color: var(--text);
            padding: 14px 28px; border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow); z-index: 3000;
            font-size: 14px; font-weight: 500;
            opacity: 0; transition: all 0.3s ease;
            display: flex; align-items: center; gap: 10px;
        }
        .toast.show {
            opacity: 1; transform: translateX(-50%) translateY(0);
        }
        .toast i { color: var(--primary); }

        /* Mobile Nav */
        .mobile-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            z-index: 999; display: none; padding: 6px 0;
        }
        .mobile-nav-items { display: flex; justify-content: space-around; }
        .mobile-nav-item {
            display: flex; flex-direction: column; align-items: center;
            gap: 3px; padding: 6px 12px;
            color: var(--text-muted); text-decoration: none;
            font-size: 10px; transition: var(--transition);
            border: none; background: none; cursor: pointer;
            font-family: inherit;
        }
        .mobile-nav-item i { font-size: 18px; }
        .mobile-nav-item.active { color: var(--primary); }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.5s ease forwards; opacity: 0; }
        .stagger-1 { animation-delay: 0.05s; }
        .stagger-2 { animation-delay: 0.1s; }
        .stagger-3 { animation-delay: 0.15s; }
        .stagger-4 { animation-delay: 0.2s; }
        .stagger-5 { animation-delay: 0.25s; }
        .stagger-6 { animation-delay: 0.3s; }

        /* Responsive */
        @media (max-width: 1024px) {
            .hero-title { font-size: 36px; }
            .detail-hero-content { flex-direction: column; align-items: flex-start; padding: 30px; }
            .detail-poster { width: 140px; }
            .detail-title { font-size: 26px; }
        }
        @media (max-width: 768px) {
            .header-inner { height: 60px; }
            .nav { display: none; }
            .search-box { width: 180px; }
            .mobile-menu-btn { display: block; }
            .hero { height: 400px; }
            .hero-title { font-size: 26px; }
            .movie-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .category-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
            .detail-hero { min-height: auto; }
            .detail-hero-content { padding: 20px; }
            .detail-poster { width: 100px; }
            .detail-title { font-size: 20px; }
            .detail-body { padding: 0 20px 20px; }
            .section { padding: 24px 16px; }
            .mobile-nav { display: block; }
            .main { margin-bottom: 70px; }
        }
        @media (max-width: 480px) {
            .search-box { width: 140px; }
            .hero-title { font-size: 22px; }
            .movie-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
            .episode-grid { grid-template-columns: repeat(4, 1fr); }
            .category-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <header class="header" id="header">
        <div class="header-inner">
            <a href="#" class="logo" onclick="app.goHome(); return false;">

                <i class="fas fa-film"></i><span>Phim Lẻ</span>
            </button>
            <button class="mobile-nav-item" onclick="app.setList('phim-bo')">
                <i class="fas fa-tv"></i><span>Phim Bộ</span>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        const API_BASE = 'https://phimapi.com';
        const CDN_IMAGE = 'https://phimimg.com';

        const app = {
            currentPage: 1,
            totalPages: 1,
            currentView: 'home',
            currentSlug: '',
            currentType: '',
            searchKeyword: '',
            heroMovie: null,
            categories: [],
            countries: [],
            currentMovie: null,
            currentServer: 0,
            currentEpisode: 0,
            hls: null,

            init() {
                this.loadHome();
                this.loadFilters();
                this.setupScroll();
                this.setupHash();
            },

            setupScroll() {
                window.addEventListener('scroll', () => {
                    const header = document.getElementById('header');
                    header.classList.toggle('scrolled', window.scrollY > 50);
                });
            },

            setupHash() {
                window.addEventListener('hashchange', () => this.handleHash());
                if (window.location.hash) this.handleHash();
            },

            handleHash() {
                const hash = window.location.hash.replace('#', '');
                if (!hash) return;
                if (hash.startsWith('phim/')) {
                    this.showDetailModalBySlug(hash.replace('phim/', ''));
                }
            },

            async fetchAPI(url) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('API Error: ' + response.status);
                    return await response.json();
                } catch (error) {
                    this.showToast('Lỗi kết nối API, vui lòng thử lại!');
                    console.error(error);
                    return null;
                }
            },

            getImageUrl(url) {
                if (!url) return 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22450%22><rect fill=%22%231a1a1a%22 width=%22300%22 height=%22450%22/><text fill=%22%23666%22 x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 font-size=%2216%22>No Image</text></svg>';
                if (url.startsWith('http')) return url;
                return CDN_IMAGE + '/' + url;
            },

            // ========== HOME ==========
            async loadHome() {
                this.currentView = 'home';
                this.currentPage = 1;
                this.updateNav('home');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'flex';
                document.getElementById('breadcrumbSection').style.display = 'none';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-compass"></i> Phim Mới Cập Nhật';
                document.getElementById('resultCount').textContent = '';

                const data = await this.fetchAPI(API_BASE + '/v1/api/home');
                if (!data || !data.data) return;

                const items = data.data.items || [];
                const cdnImage = data.data.APP_DOMAIN_CDN_IMAGE || CDN_IMAGE;

                if (items.length > 0) {
                    this.heroMovie = items[0];
                    this.renderHero(items[0], cdnImage);
                }

                this.renderMovies(items, cdnImage);
                this.totalPages = 1;
                this.renderPagination();
            },

            renderHero(movie, cdn) {
                const thumbUrl = this.getImageUrl(movie.thumb_url);
                document.getElementById('heroBg').style.backgroundImage = 'url(' + thumbUrl + ')';
                document.getElementById('heroTitle').textContent = movie.name;

                const cats = (movie.category || []).map(function(c) { return c.name; }).join(', ');

                document.getElementById('heroMeta').innerHTML = 
                    '<span class="rating"><i class="fas fa-star"></i> ' + (movie.tmdb ? movie.tmdb.vote_average : 'N/A') + '</span>' +
                    '<span><i class="fas fa-calendar"></i> ' + movie.year + '</span>' +
                    '<span><i class="fas fa-clock"></i> ' + movie.time + '</span>' +
                    '<span><i class="fas fa-closed-captioning"></i> ' + movie.lang + '</span>' +
                    '<span class="tag">' + movie.quality + '</span>' +
                    '<span class="tag">' + cats + '</span>';

                const temp = document.createElement('div');
                temp.innerHTML = movie.content || '';
                document.getElementById('heroDesc').textContent = temp.textContent || temp.innerText || '';

                const self = this;
                document.getElementById('heroWatchBtn').onclick = function() { self.showDetailModalBySlug(movie.slug); };
                document.getElementById('heroDetailBtn').onclick = function() { self.showDetailModalBySlug(movie.slug); };
            },

            // ========== LIST ==========
            async setList(slug) {
                this.currentView = 'list';
                this.currentSlug = slug;
                this.currentType = 'danh-sach';
                this.currentPage = 1;
                this.updateNav(slug);
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';

                const titles = { 'phim-le': 'Phim Lẻ', 'phim-bo': 'Phim Bộ', 'hoat-hinh': 'Hoạt Hình' };
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-film"></i> ' + titles[slug];
                this.renderBreadcrumb([{ name: 'Trang chủ', action: 'goHome' }, { name: titles[slug] }]);

                await this.loadMovies();
            },

            // ========== GENRES ==========
            async showGenres() {
                this.currentView = 'genres';
                this.updateNav('the-loai');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-tags"></i> Thể Loại Phim';
                document.getElementById('resultCount').textContent = '';
                document.getElementById('pagination').innerHTML = '';
                this.renderBreadcrumb([{ name: 'Trang chủ', action: 'goHome' }, { name: 'Thể loại' }]);

                if (this.categories.length === 0) {
                    const data = await this.fetchAPI(API_BASE + '/v1/api/the-loai');
                    if (data && data.data && data.data.items) this.categories = data.data.items;
                }

                const grid = document.getElementById('movieGrid');
                grid.className = 'category-grid';
                const self = this;
                grid.innerHTML = this.categories.map(function(cat, idx) {
                    return '<div class="category-card fade-in stagger-' + ((idx % 6) + 1) + '" onclick="app.setGenre(' + "'" + cat.slug + "','" + cat.name.replace(/'/g, "\\'") + "')" + '" style="opacity:0;">' +
                        '<i class="fas fa-film"></i>' +
                        '<div class="name">' + cat.name + '</div>' +
                        '</div>';
                }).join('');

                requestAnimationFrame(function() {
                    document.querySelectorAll('.fade-in').forEach(function(el) { el.style.opacity = '1'; });
                });
            },

            async setGenre(slug, name) {
                this.currentView = 'genre';
                this.currentSlug = slug;
                this.currentType = 'the-loai';
                this.currentPage = 1;
                this.updateNav('');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-tag"></i> Thể Loại: ' + name;
                this.renderBreadcrumb([
                    { name: 'Trang chủ', action: 'goHome' },
                    { name: 'Thể loại', action: 'showGenres' },
                    { name: name }
                ]);

                await this.loadMovies();
            },

            // ========== COUNTRIES ==========
            async showCountries() {
                this.currentView = 'countries';
                this.updateNav('quoc-gia');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-globe"></i> Quốc Gia';
                document.getElementById('resultCount').textContent = '';
                document.getElementById('pagination').innerHTML = '';
                this.renderBreadcrumb([{ name: 'Trang chủ', action: 'goHome' }, { name: 'Quốc gia' }]);

                if (this.countries.length === 0) {
                    const data = await this.fetchAPI(API_BASE + '/v1/api/quoc-gia');
                    if (data && data.data && data.data.items) this.countries = data.data.items;
                }

                const grid = document.getElementById('movieGrid');
                grid.className = 'category-grid';
                grid.innerHTML = this.countries.map(function(c, idx) {
                    return '<div class="category-card fade-in stagger-' + ((idx % 6) + 1) + '" onclick="app.setCountry(' + "'" + c.slug + "','" + c.name.replace(/'/g, "\\'") + "')" + '" style="opacity:0;">' +
                        '<i class="fas fa-flag"></i>' +
                        '<div class="name">' + c.name + '</div>' +
                        '</div>';
                }).join('');

                requestAnimationFrame(function() {
                    document.querySelectorAll('.fade-in').forEach(function(el) { el.style.opacity = '1'; });
                });
            },

            async setCountry(slug, name) {
                this.currentView = 'country';
                this.currentSlug = slug;
                this.currentType = 'quoc-gia';
                this.currentPage = 1;
                this.updateNav('');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-flag"></i> Quốc Gia: ' + name;
                this.renderBreadcrumb([
                    { name: 'Trang chủ', action: 'goHome' },
                    { name: 'Quốc gia', action: 'showCountries' },
                    { name: name }
                ]);

                await this.loadMovies();
            },

            // ========== YEARS ==========
            showYears() {
                this.currentView = 'years';
                this.updateNav('nam');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-calendar-alt"></i> Năm Phát Hành';
                document.getElementById('resultCount').textContent = '';
                document.getElementById('pagination').innerHTML = '';
                this.renderBreadcrumb([{ name: 'Trang chủ', action: 'goHome' }, { name: 'Năm' }]);

                const currentYear = new Date().getFullYear();
                const years = [];
                for (let y = currentYear; y >= 1990; y--) years.push(y);

                const grid = document.getElementById('movieGrid');
                grid.className = 'category-grid';
                grid.innerHTML = years.map(function(year, idx) {
                    return '<div class="category-card fade-in stagger-' + ((idx % 6) + 1) + '" onclick="app.setYear(' + year + ')" style="opacity:0;">' +
                        '<i class="fas fa-calendar"></i>' +
                        '<div class="name">' + year + '</div>' +
                        '</div>';
                }).join('');

                requestAnimationFrame(function() {
                    document.querySelectorAll('.fade-in').forEach(function(el) { el.style.opacity = '1'; });
                });
            },

            async setYear(year) {
                this.currentView = 'year';
                this.currentSlug = year;
                this.currentType = 'nam';
                this.currentPage = 1;
                this.updateNav('');
                this.clearSearch();

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-calendar"></i> Năm: ' + year;
                this.renderBreadcrumb([
                    { name: 'Trang chủ', action: 'goHome' },
                    { name: 'Năm', action: 'showYears' },
                    { name: year }
                ]);

                await this.loadMovies();
            },

            // ========== LOAD MOVIES ==========
            async loadMovies() {
                this.showLoading();

                let url;
                if (this.currentView === 'search') {
                    url = API_BASE + '/v1/api/tim-kiem?keyword=' + encodeURIComponent(this.searchKeyword) + '&page=' + this.currentPage;
                } else if (this.currentType === 'the-loai') {
                    url = API_BASE + '/v1/api/the-loai/' + this.currentSlug + '?page=' + this.currentPage;
                } else if (this.currentType === 'quoc-gia') {
                    url = API_BASE + '/v1/api/quoc-gia/' + this.currentSlug + '?page=' + this.currentPage;
                } else if (this.currentType === 'nam') {
                    url = API_BASE + '/v1/api/danh-sach/phim-moi-cap-nhat?page=' + this.currentPage + '&year=' + this.currentSlug;
                } else {
                    url = API_BASE + '/v1/api/danh-sach/' + this.currentSlug + '?page=' + this.currentPage;
                }

                const data = await this.fetchAPI(url);
                if (!data || !data.data) {
                    this.renderMovies([]);
                    return;
                }

                const items = data.data.items || [];
                const cdnImage = data.data.APP_DOMAIN_CDN_IMAGE || CDN_IMAGE;
                const pagination = data.data.params ? data.data.params.pagination : {};

                this.totalPages = pagination.totalPages || 1;
                document.getElementById('resultCount').textContent = 
                    pagination.totalItems ? 'Tổng ' + pagination.totalItems + ' phim' : items.length + ' phim';

                const grid = document.getElementById('movieGrid');
                grid.className = 'movie-grid';
                this.renderMovies(items, cdnImage);
                this.renderPagination();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            },

            renderMovies(movies, cdn) {
                const grid = document.getElementById('movieGrid');

                if (movies.length === 0) {
                    grid.innerHTML = 
                        '<div style="grid-column: 1/-1; text-align: center; padding: 60px; color: var(--text-muted);">' +
                        '<i class="fas fa-film" style="font-size: 48px; margin-bottom: 16px; display:block;"></i>' +
                        '<p>Không tìm thấy phim nào</p></div>';
                    return;
                }

                const self = this;
                grid.innerHTML = movies.map(function(movie, index) {
                    const posterUrl = self.getImageUrl(movie.poster_url);
                    const isSeries = movie.type === 'series';
                    const episodeText = isSeries ? movie.episode_current : 'Full';
                    const langParts = movie.lang ? movie.lang.split('+') : ['Vietsub'];
                    const langShort = langParts[0].trim();

                    return '<div class="movie-card fade-in stagger-' + ((index % 6) + 1) + '" ' +
                        'onclick="app.showDetailModalBySlug(' + "'" + movie.slug + "')" + '" style="opacity: 0;">' +
                        '<div class="movie-poster">' +
                        '<img src="' + posterUrl + '" alt="' + movie.name + '" loading="lazy" onerror="this.src=' + "'" + self.getImageUrl('') + "'" + '">' +
                        '<div class="movie-overlay"><div class="play-btn"><i class="fas fa-play"></i></div></div>' +
                        '<span class="movie-badge badge-quality">' + movie.quality + '</span>' +
                        (isSeries ? '<span class="movie-badge badge-episode">' + episodeText + '</span>' : '') +
                        '<span class="badge-lang">' + langShort + '</span>' +
                        '</div>' +
                        '<div class="movie-info">' +
                        '<div class="movie-name">' + movie.name + '</div>' +
                        '<div class="movie-meta">' +
                        '<span><i class="fas fa-calendar"></i> ' + movie.year + '</span>' +
                        '<span><i class="fas fa-star"></i> ' + (movie.tmdb ? movie.tmdb.vote_average : 'N/A') + '</span>' +
                        '</div></div></div>';
                }).join('');

                requestAnimationFrame(function() {
                    document.querySelectorAll('.fade-in').forEach(function(el) { el.style.opacity = '1'; });
                });
            },

            renderPagination() {
                const container = document.getElementById('pagination');
                if (this.totalPages <= 1) {
                    container.innerHTML = '';
                    return;
                }

                let html = '';
                html += '<button class="page-btn" ' + (this.currentPage === 1 ? 'disabled' : '') + ' onclick="app.goPage(' + (this.currentPage - 1) + ')"><i class="fas fa-chevron-left"></i></button>';

                if (this.currentPage > 3) {
                    html += '<button class="page-btn" onclick="app.goPage(1)">1</button>';
                    if (this.currentPage > 4) html += '<span style="color: var(--text-muted); padding: 0 8px;">...</span>';
                }

                for (let i = Math.max(1, this.currentPage - 2); i <= Math.min(this.totalPages, this.currentPage + 2); i++) {
                    html += '<button class="page-btn ' + (i === this.currentPage ? 'active' : '') + '" onclick="app.goPage(' + i + ')">' + i + '</button>';
                }

                if (this.currentPage < this.totalPages - 2) {
                    if (this.currentPage < this.totalPages - 3) html += '<span style="color: var(--text-muted); padding: 0 8px;">...</span>';
                    html += '<button class="page-btn" onclick="app.goPage(' + this.totalPages + ')">' + this.totalPages + '</button>';
                }

                html += '<button class="page-btn" ' + (this.currentPage === this.totalPages ? 'disabled' : '') + ' onclick="app.goPage(' + (this.currentPage + 1) + ')"><i class="fas fa-chevron-right"></i></button>';

                container.innerHTML = html;
            },

            goPage(page) {
                if (page < 1 || page > this.totalPages) return;
                this.currentPage = page;
                this.loadMovies();
            },

            // ========== SEARCH ==========
            async search(keyword) {
                if (!keyword.trim()) {
                    this.goHome();
                    return;
                }

                this.currentView = 'search';
                this.searchKeyword = keyword.trim();
                this.currentPage = 1;
                this.updateNav('');

                document.getElementById('heroSection').style.display = 'none';
                document.getElementById('breadcrumbSection').style.display = 'block';
                document.getElementById('sectionTitle').innerHTML = '<i class="fas fa-search"></i> Kết quả: "' + this.searchKeyword + '"';
                this.renderBreadcrumb([{ name: 'Trang chủ', action: 'goHome' }, { name: 'Tìm kiếm: ' + this.searchKeyword }]);

                await this.loadMovies();
            },

            clearSearch() {
                document.getElementById('searchInput').value = '';
            },

            // ========== DETAIL MODAL ==========
            async showDetailModalBySlug(slug) {
                this.showToast('Đang tải thông tin phim...');
                const data = await this.fetchAPI(API_BASE + '/v1/api/phim/' + slug);
                if (!data || !data.data) return;

                const movie = data.data.item;
                movie.APP_DOMAIN_CDN_IMAGE = data.data.APP_DOMAIN_CDN_IMAGE;
                this.showDetailModal(movie);
                window.location.hash = 'phim/' + slug;
            },

            showDetailModal(movie) {
                this.currentMovie = movie;
                this.currentServer = 0;
                this.currentEpisode = 0;

                const cdn = movie.APP_DOMAIN_CDN_IMAGE || CDN_IMAGE;
                const posterUrl = this.getImageUrl(movie.poster_url);
                const thumbUrl = this.getImageUrl(movie.thumb_url);

                const cats = (movie.category || []).map(function(c) { return '<span class="tag">' + c.name + '</span>'; }).join('');
                const countries = (movie.country || []).map(function(c) { return c.name; }).join(', ');

                const temp = document.createElement('div');
                temp.innerHTML = movie.content || '';

                const episodes = movie.episodes || [];
                const hasEpisodes = episodes.length > 0 && episodes[0].server_data && episodes[0].server_data.length > 0;

                let videoHtml = '';
                if (hasEpisodes) {
                    videoHtml = 
                        '<div class="video-wrapper" id="videoWrapper">' +
                        '<video id="videoPlayer" controls playsinline style="width:100%; display:block;"></video>' +
                        '</div>';
                } else {
                    videoHtml = 
                        '<div class="video-wrapper">' +
                        '<div class="video-placeholder">' +
                        '<i class="fas fa-film"></i>' +
                        '<p>Chưa có link phát</p>' +
                        '</div></div>';
                }

                let episodesHtml = '';
                if (hasEpisodes) {
                    episodesHtml += '<div class="server-tabs">';
                    episodes.forEach(function(server, idx) {
                        episodesHtml += '<button class="server-tab ' + (idx === 0 ? 'active' : '') + '" onclick="app.switchServer(' + idx + ')">' + server.server_name + '</button>';
                    });
                    episodesHtml += '</div>';

                    episodesHtml += '<div class="episode-grid" id="episodeGrid">';
                    const server = episodes[0];
                    server.server_data.forEach(function(ep, idx) {
                        episodesHtml += '<button class="episode-btn ' + (idx === 0 ? 'active' : '') + '" onclick="app.playEpisode(' + idx + ')">' + ep.name + '</button>';
                    });
                    episodesHtml += '</div>';
                }

                const self = this;
                const html = 
                    '<div class="detail-hero">' +
                    '<div class="detail-hero-bg" style="background-image: url(' + "'" + thumbUrl + "'" + ')"></div>' +
                    '<div class="detail-hero-overlay"></div>' +
                    '<div class="detail-hero-content">' +
                    '<div class="detail-poster">' +
                    '<img src="' + posterUrl + '" alt="' + movie.name + '" onerror="this.src=' + "'" + this.getImageUrl('') + "'" + '">' +
                    '</div>' +
                    '<div class="detail-info">' +
                    '<h1 class="detail-title">' + movie.name + '</h1>' +
                    '<div class="detail-origin">' + (movie.origin_name || '') + '</div>' +
                    '<div class="detail-meta">' +
                    '<span class="tag">' + movie.quality + '</span>' +
                    '<span><i class="fas fa-star" style="color: #f5c518;"></i> ' + (movie.tmdb ? movie.tmdb.vote_average : 'N/A') + '</span>' +
                    '<span><i class="fas fa-calendar"></i> ' + movie.year + '</span>' +
                    '<span><i class="fas fa-clock"></i> ' + movie.time + '</span>' +
                    '<span><i class="fas fa-closed-captioning"></i> ' + movie.lang + '</span>' +
                    '<span><i class="fas fa-globe"></i> ' + countries + '</span>' +
                    '</div>' +
                    '<div class="detail-meta">' + cats + '</div>' +
                    '<div class="detail-actions">' +
                    '<button class="btn btn-primary" onclick="app.playCurrent()">' +
                    '<i class="fas fa-play"></i> Xem Phim</button>' +
                    '<button class="btn btn-secondary" onclick="app.copyLink(' + "'" + movie.slug + "'" + ')">' +
                    '<i class="fas fa-share"></i> Chia Sẻ</button>' +
                    '</div></div></div></div>' +
                    '<div class="detail-body">' +
                    '<div class="detail-section">' +
                    '<h3 class="detail-section-title"><i class="fas fa-align-left"></i> Nội Dung</h3>' +
                    '<div class="detail-content">' + (movie.content || '<p>Chưa có nội dung.</p>') + '</div>' +
                    '</div>' +
                    (movie.actor && movie.actor.length ? 
                    '<div class="detail-section">' +
                    '<h3 class="detail-section-title"><i class="fas fa-users"></i> Diễn Viên</h3>' +
                    '<div class="cast-list">' +
                    movie.actor.map(function(a) { return '<div class="cast-item"><i class="fas fa-user"></i> ' + a + '</div>'; }).join('') +
                    '</div></div>' : '') +
                    (movie.director && movie.director.length ? 
                    '<div class="detail-section">' +
                    '<h3 class="detail-section-title"><i class="fas fa-video"></i> Đạo Diễn</h3>' +
                    '<div class="cast-list">' +
                    movie.director.map(function(d) { return '<div class="cast-item"><i class="fas fa-user-tie"></i> ' + d + '</div>'; }).join('') +
                    '</div></div>' : '') +
                    '<div class="detail-section">' +
                    '<h3 class="detail-section-title"><i class="fas fa-play-circle"></i> Xem Phim</h3>' +
                    videoHtml + episodesHtml +
                    '</div></div>';

                document.getElementById('modalBody').innerHTML = html;
                document.getElementById('detailModal').classList.add('active');
                document.body.style.overflow = 'hidden';

                if (hasEpisodes) {
                    setTimeout(function() { self.playEpisode(0); }, 300);
                }
            },

            switchServer(serverIdx) {
                this.currentServer = serverIdx;
                this.currentEpisode = 0;

                const tabs = document.querySelectorAll('.server-tab');
                tabs.forEach(function(tab, idx) {
                    tab.classList.toggle('active', idx === serverIdx);
                });

                const server = this.currentMovie.episodes[serverIdx];
                const grid = document.getElementById('episodeGrid');
                grid.innerHTML = server.server_data.map(function(ep, idx) {
                    return '<button class="episode-btn ' + (idx === 0 ? 'active' : '') + '" onclick="app.playEpisode(' + idx + ')">' + ep.name + '</button>';
                }).join('');

                this.playEpisode(0);
            },

            playEpisode(epIdx) {
                this.currentEpisode = epIdx;

                const btns = document.querySelectorAll('.episode-btn');
                btns.forEach(function(btn, idx) {
                    btn.classList.toggle('active', idx === epIdx);
                });

                this.playCurrent();
            },

            playCurrent() {
                const server = this.currentMovie.episodes[this.currentServer];
                const ep = server.server_data[this.currentEpisode];
                const video = document.getElementById('videoPlayer');

                if (!video) return;

                if (this.hls) {
                    this.hls.destroy();
                    this.hls = null;
                }

                const m3u8Url = ep.link_m3u8;

                if (!m3u8Url) {
                    this.showToast('Không có link phát cho tập này');
                    return;
                }

                if (Hls.isSupported()) {
                    this.hls = new Hls({
                        maxBufferLength: 30,
                        maxMaxBufferLength: 60,
                        enableWorker: true
                    });
                    this.hls.loadSource(m3u8Url);
                    this.hls.attachMedia(video);
                    this.hls.on(Hls.Events.MANIFEST_PARSED, function() {
                        video.play().catch(function() {});
                    });
                    this.hls.on(Hls.Events.ERROR, function(event, data) {
                        if (data.fatal) {
                            console.error('HLS fatal error:', data);
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = m3u8Url;
                    video.addEventListener('loadedmetadata', function() {
                        video.play().catch(function() {});
                    });
                } else {
                    this.showToast('Trình duyệt không hỗ trợ phát HLS');
                }

                video.scrollIntoView({ behavior: 'smooth', block: 'center' });
            },

            closeModal() {
                document.getElementById('detailModal').classList.remove('active');
                document.body.style.overflow = '';

                if (this.hls) {
                    this.hls.destroy();
                    this.hls = null;
                }
                const video = document.getElementById('videoPlayer');
                if (video) {
                    video.pause();
                    video.src = '';
                    video.load();
                }
                window.location.hash = '';
            },

            // ========== BREADCRUMB ==========
            renderBreadcrumb(items) {
                const container = document.getElementById('breadcrumb');
                let html = '';
                items.forEach(function(item, idx) {
                    if (idx > 0) html += '<i class="fas fa-chevron-right"></i>';
                    if (item.action) {
                        html += '<a href="#" onclick="app.' + item.action + '(); return false;">' + item.name + '</a>';
                    } else {
                        html += '<span>' + item.name + '</span>';
                    }
                });
                container.innerHTML = html;
            },

            // ========== FILTERS ==========
            async loadFilters() {
                const catData = await this.fetchAPI(API_BASE + '/v1/api/the-loai');
                if (catData && catData.data && catData.data.items) {
                    this.categories = catData.data.items;
                }

                const countryData = await this.fetchAPI(API_BASE + '/v1/api/quoc-gia');
                if (countryData && countryData.data && countryData.data.items) {
                    this.countries = countryData.data.items;
                }
            },

            // ========== UTILS ==========
            updateNav(type) {
                document.querySelectorAll('.nav-btn').forEach(function(btn) {
                    btn.classList.toggle('active', btn.dataset.type === type);
                });
                document.querySelectorAll('.mobile-nav-item').forEach(function(btn, idx) {
                    const types = ['home', 'phim-le', 'phim-bo', 'the-loai'];
                    btn.classList.toggle('active', types[idx] === type);
                });
            },

            goHome() {
                this.loadHome();
                return false;
            },

            showLoading() {
                const grid = document.getElementById('movieGrid');
                grid.innerHTML = 
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>' +
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>' +
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>' +
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>' +
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>' +
                    '<div class="skeleton-card"><div class="skeleton-poster"></div><div class="skeleton-info"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div></div>';
            },

            showToast(message) {
                const toast = document.getElementById('toast');
                document.getElementById('toastMessage').textContent = message;
                toast.classList.add('show');
                setTimeout(function() { toast.classList.remove('show'); }, 3000);
            },

            copyLink(slug) {
                const url = window.location.origin + window.location.pathname + '#phim/' + slug;
                navigator.clipboard.writeText(url).then(function() {
                    app.showToast('Đã sao chép link chia sẻ!');
                }).catch(function() {
                    app.showToast('Không thể sao chép link');
                });
            },

            toggleMobileMenu() {
                const nav = document.getElementById('desktopNav');
                nav.style.display = nav.style.display === 'flex' ? 'none' : 'flex';
            }
        };

        // Close modal on escape
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') app.closeModal();
        });

        // Close modal on overlay click
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === e.currentTarget) app.closeModal();
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            app.init();
        });
    </script>
</body>
</html>
