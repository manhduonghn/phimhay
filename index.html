<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xem Phim Online - OPhim API</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                        display: ['Poppins', 'sans-serif'],
                    },
                    colors: {
                        primary: '#ef4444',
                        dark: {
                            50: '#f8fafc',
                            100: '#f1f5f9',
                            200: '#e2e8f0',
                            300: '#cbd5e1',
                            400: '#94a3b8',
                            500: '#64748b',
                            600: '#475569',
                            700: '#334155',
                            800: '#1e293b',
                            900: '#0f172a',
                            950: '#020617',
                        }
                    }
                }
            }
        }
    </script>

    <!-- HLS.js -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #ef4444; }

        body { background: #020617; color: #f1f5f9; font-family: 'Inter', sans-serif; }
        .aspect-poster { aspect-ratio: 2 / 3; }
        .logo-glow { text-shadow: 0 0 20px rgba(239, 68, 68, 0.4); }

        .movie-card { transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
        .movie-card:hover {
            transform: translateY(-6px) scale(1.02);
            box-shadow: 0 12px 30px rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.6);
        }

        .skeleton-shimmer {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

        .episode-btn.active { background: #ef4444; color: white; box-shadow: 0 0 12px rgba(239, 68, 68, 0.5); }
        .server-btn.active { background: #ef4444; color: white; }

        select {
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- ========== HEADER ========== -->
    <header class="sticky top-0 z-40 bg-dark-950/90 backdrop-blur-md border-b border-dark-800/80">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-3">
            
            <!-- Logo & Search -->
            <div class="flex items-center justify-between w-full md:w-auto gap-4">
                <a href="#danh-sach/phim-moi?page=1" class="flex items-center gap-2 text-primary text-2xl font-black tracking-wider uppercase font-display logo-glow shrink-0">
                    <i data-lucide="play-circle" class="w-8 h-8 fill-primary text-primary"></i>
                    <span>Phim<span class="text-white">Chill</span></span>
                </a>

                <!-- Mobile Search -->
                <form onsubmit="handleSearch(event)" class="relative flex-1 md:hidden">
                    <input id="searchInputMobile" type="text" placeholder="Tìm phim..." 
                           class="w-full bg-dark-800 text-xs text-slate-100 rounded-full pl-8 pr-3 py-2 border border-dark-700 focus:outline-none focus:border-primary">
                    <i data-lucide="search" class="w-3.5 h-3.5 absolute left-2.5 top-2.5 text-slate-400"></i>
                </form>
            </div>

            <!-- Desktop Search Bar -->
            <form onsubmit="handleSearch(event)" class="relative hidden md:block flex-1 max-w-sm">
                <input id="searchInputDesktop" type="text" placeholder="Tìm kiếm phim (Avengers, Naruto...)" 
                       class="w-full bg-dark-800/80 text-sm text-slate-100 rounded-full pl-10 pr-4 py-2 border border-dark-700 focus:outline-none focus:border-primary transition-all">
                <i data-lucide="search" class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400"></i>
            </form>

            <!-- Filters & Categories Bar -->
            <nav class="flex items-center gap-2 overflow-x-auto w-full md:w-auto py-1 scrollbar-hide text-xs font-semibold">
                <!-- Dropdown Danh Mục -->
                <select id="selectCategory" onchange="onSelectChange(this)" class="bg-dark-800 text-slate-200 border border-dark-700 rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="">-- Danh Mục --</option>
                    <option value="#danh-sach/phim-moi?page=1">🔥 Phim Mới</option>
                    <option value="#danh-sach/phim-bo?page=1">📺 Phim Bộ</option>
                    <option value="#danh-sach/phim-le?page=1">🎬 Phim Lẻ</option>
                    <option value="#danh-sach/hoat-hinh?page=1">🎨 Hoạt Hình</option>
                    <option value="#danh-sach/tv-shows?page=1">📡 TV Shows</option>
                    <option value="#danh-sach/phim-vietsub?page=1">🇻🇳 Phim Vietsub</option>
                    <option value="#danh-sach/phim-thuyet-minh?page=1">🎙️ Thuyết Minh</option>
                    <option value="#danh-sach/phim-long-tien?page=1">🗣️ Lồng Tiếng</option>
                    <option value="#danh-sach/phim-chieu-rap?page=1">🍿 Phim Chiếu Rạp</option>
                </select>

                <!-- Dropdown Thể Loại -->
                <select id="selectGenre" onchange="onSelectChange(this)" class="bg-dark-800 text-slate-200 border border-dark-700 rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="">-- Thể Loại --</option>
                </select>

                <!-- Dropdown Quốc Gia -->
                <select id="selectCountry" onchange="onSelectChange(this)" class="bg-dark-800 text-slate-200 border border-dark-700 rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="">-- Quốc Gia --</option>
                </select>

                <!-- Dropdown Năm -->
                <select id="selectYear" onchange="onSelectChange(this)" class="bg-dark-800 text-slate-200 border border-dark-700 rounded-lg px-3 py-1.5 focus:outline-none cursor-pointer">
                    <option value="">-- Năm --</option>
                </select>
            </nav>
        </div>
    </header>

    <!-- ========== MAIN CONTENT AREA ========== -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-1 w-full">
        
        <!-- SECTION 1: LIST VIEW (Category / Search / Genre / Country / Year) -->
        <section id="listView" class="space-y-6">
            <div class="flex items-center justify-between border-b border-dark-800 pb-4">
                <h1 id="pageTitle" class="text-xl md:text-2xl font-bold border-l-4 border-primary pl-3 font-display">
                    Danh Sách Phim
                </h1>
                <div id="pagination" class="flex items-center gap-2"></div>
            </div>

            <!-- Movie Grid -->
            <div id="movieGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>

            <!-- Skeleton Loading -->
            <div id="loadingSkeleton" class="hidden grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
                <div class="skeleton-shimmer rounded-xl aspect-poster"></div>
            </div>
        </section>

        <!-- SECTION 2: MOVIE DETAIL & PLAYER VIEW -->
        <section id="detailView" class="hidden space-y-6">
            <!-- Back Button -->
            <button onclick="window.history.back()" class="flex items-center gap-2 text-sm text-slate-400 hover:text-white transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i> Quay lại
            </button>

            <!-- Video Player Section (Hiển thị khi người dùng đã chọn tập) -->
            <div id="playerContainer" class="hidden space-y-3">
                <div class="relative bg-black rounded-2xl overflow-hidden aspect-video border border-dark-700 shadow-2xl">
                    <video id="videoPlayer" controls class="w-full h-full object-contain"></video>
                </div>
                <div id="nowPlayingTitle" class="text-sm font-semibold text-primary flex items-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> Đang phát: <span id="currentEpName" class="text-white">...</span>
                </div>
            </div>

            <!-- Movie Info Header Card -->
            <div class="bg-dark-900 rounded-2xl p-5 md:p-8 border border-dark-800 flex flex-col md:flex-row gap-6 relative overflow-hidden">
                <!-- Poster -->
                <div class="w-40 md:w-56 shrink-0 mx-auto md:mx-0">
                    <img id="detailPoster" src="" alt="" class="w-full aspect-poster object-cover rounded-xl shadow-lg border border-dark-700">
                </div>

                <!-- Specs / Metadata -->
                <div class="flex-1 space-y-4">
                    <div>
                        <h1 id="detailTitle" class="text-2xl md:text-3xl font-black font-display text-white">---</h1>
                        <p id="detailSubTitle" class="text-sm text-slate-400 font-medium mt-1">---</p>
                    </div>

                    <!-- Tags -->
                    <div class="flex flex-wrap gap-2 text-xs font-semibold">
                        <span id="detailQuality" class="bg-primary/90 text-white px-2.5 py-1 rounded-md">HD</span>
                        <span id="detailLang" class="bg-dark-800 border border-dark-700 text-slate-200 px-2.5 py-1 rounded-md">Vietsub</span>
                        <span id="detailYear" class="bg-dark-800 border border-dark-700 text-slate-200 px-2.5 py-1 rounded-md">2025</span>
                        <span id="detailTime" class="bg-dark-800 border border-dark-700 text-slate-200 px-2.5 py-1 rounded-md">120 phút</span>
                    </div>

                    <!-- Genre & Country Tags -->
                    <div class="space-y-2 text-xs">
                        <div class="flex flex-wrap items-center gap-1">
                            <span class="text-slate-400">Thể loại:</span>
                            <div id="detailGenres" class="flex flex-wrap gap-1.5"></div>
                        </div>
                        <div class="flex flex-wrap items-center gap-1">
                            <span class="text-slate-400">Quốc gia:</span>
                            <div id="detailCountries" class="flex flex-wrap gap-1.5"></div>
                        </div>
                        <p class="text-slate-400">Đạo diễn: <span id="detailDirector" class="text-slate-200">Đang cập nhật</span></p>
                        <p class="text-slate-400">Diễn viên: <span id="detailCast" class="text-slate-200">Đang cập nhật</span></p>
                    </div>

                    <!-- Nội dung -->
                    <div>
                        <h3 class="text-sm font-bold text-slate-300 mb-1">Nội dung phim</h3>
                        <p id="detailDesc" class="text-xs md:text-sm text-slate-400 leading-relaxed line-clamp-4 md:line-clamp-none"></p>
                    </div>
                </div>
            </div>

            <!-- Episodes & Servers Card -->
            <div class="bg-dark-900 rounded-2xl p-5 md:p-6 border border-dark-800 space-y-4">
                <h3 class="text-base font-bold text-white flex items-center gap-2">
                    <i data-lucide="tv" class="w-5 h-5 text-primary"></i> Danh Sách Tập Phim
                </h3>
                
                <!-- Server list -->
                <div class="flex flex-wrap items-center gap-2 border-b border-dark-800 pb-3" id="serverList"></div>
                
                <!-- Episode Grid -->
                <div id="episodeList" class="flex flex-wrap gap-2 max-h-60 overflow-y-auto p-1"></div>
            </div>
        </section>

    </main>

    <!-- JS LOGIC & ROUTER -->
    <script>
        const API_BASE = "https://ophim1.com/v1/api";
        const CDN_IMAGE = "https://img.ophim.live/uploads/movies/";

        let hlsPlayer = null;
        let currentEpisodesData = [];

        // Init
        document.addEventListener('DOMContentLoaded', async () => {
            lucide.createIcons();
            await loadFilterOptions(); // Load Thể loại, Quốc gia, Năm
            window.addEventListener('hashchange', handleRoute);
            handleRoute(); // Execute initial route
        });

        // ========== ROUTER (HASH BASED) ==========
        async function handleRoute() {
            const hash = window.location.hash.slice(1) || 'danh-sach/phim-moi?page=1';
            const [path, queryString] = hash.split('?');
            const params = new URLSearchParams(queryString || '');
            const page = parseInt(params.get('page')) || 1;
            const keyword = params.get('keyword') || '';

            const parts = path.split('/');
            const route = parts[0];
            const slug = parts[1] || '';

            stopVideo();

            if (route === 'phim' && slug) {
                showView('detail');
                await loadMovieDetail(slug);
            } else {
                showView('list');
                if (route === 'danh-sach') {
                    await fetchAndRenderList(`${API_BASE}/danh-sach/${slug || 'phim-moi'}?page=${page}`, page, `Danh Sách: ${slug}`, 'danh-sach', slug);
                } else if (route === 'the-loai') {
                    await fetchAndRenderList(`${API_BASE}/the-loai/${slug}?page=${page}`, page, `Thể Loại: ${slug}`, 'the-loai', slug);
                } else if (route === 'quoc-gia') {
                    await fetchAndRenderList(`${API_BASE}/quoc-gia/${slug}?page=${page}`, page, `Quốc Gia: ${slug}`, 'quoc-gia', slug);
                } else if (route === 'nam-phat-hanh') {
                    await fetchAndRenderList(`${API_BASE}/nam-phat-hanh/${slug}?page=${page}`, page, `Năm Phát Hành: ${slug}`, 'nam-phat-hanh', slug);
                } else if (route === 'tim-kiem') {
                    await fetchAndRenderList(`${API_BASE}/tim-kiem?keyword=${encodeURIComponent(keyword)}&page=${page}`, page, `Kết quả tìm kiếm: "${keyword}"`, 'tim-kiem', '', keyword);
                } else {
                    window.location.hash = '#danh-sach/phim-moi?page=1';
                }
            }
        }

        function showView(viewName) {
            document.getElementById('listView').classList.toggle('hidden', viewName !== 'list');
            document.getElementById('detailView').classList.toggle('hidden', viewName !== 'detail');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // ========== API FETCH FILTERS DATA ==========
        async function loadFilterOptions() {
            try {
                // Genres
                const resG = await fetch(`${API_BASE}/the-loai`).then(r => r.json());
                if (resG?.status && resG?.data?.items) {
                    const selectG = document.getElementById('selectGenre');
                    resG.data.items.forEach(item => {
                        selectG.innerHTML += `<option value="#the-loai/${item.slug}?page=1">${item.name}</option>`;
                    });
                }

                // Countries
                const resC = await fetch(`${API_BASE}/quoc-gia`).then(r => r.json());
                if (resC?.status && resC?.data?.items) {
                    const selectC = document.getElementById('selectCountry');
                    resC.data.items.forEach(item => {
                        selectC.innerHTML += `<option value="#quoc-gia/${item.slug}?page=1">${item.name}</option>`;
                    });
                }

                // Years
                const resY = await fetch(`${API_BASE}/nam-phat-hanh`).then(r => r.json());
                if (resY?.status && resY?.data?.items) {
                    const selectY = document.getElementById('selectYear');
                    resY.data.items.forEach(item => {
                        selectY.innerHTML += `<option value="#nam-phat-hanh/${item.name}?page=1">Năm ${item.name}</option>`;
                    });
                }
            } catch (err) {
                console.error("Lỗi khi tải Filter options:", err);
            }
        }

        function onSelectChange(selectElem) {
            if (selectElem.value) {
                window.location.hash = selectElem.value;
                selectElem.selectedIndex = 0;
            }
        }

        // ========== RENDER MOVIE LIST ==========
        async function fetchAndRenderList(url, page, titleText, routeType, slug = '', keyword = '') {
            toggleLoading(true);
            try {
                const res = await fetch(url).then(r => r.json());
                const items = res?.data?.items || [];
                const pagination = res?.data?.params?.pagination;

                document.getElementById('pageTitle').innerText = titleText;
                const grid = document.getElementById('movieGrid');
                grid.innerHTML = '';

                if (items.length === 0) {
                    grid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-16">Không tìm thấy phim phù hợp.</div>`;
                    renderPagination(null, routeType, slug, keyword);
                    return;
                }

                items.forEach(item => {
                    const thumb = item.thumb_url?.startsWith('http') ? item.thumb_url : `${CDN_IMAGE}${item.thumb_url}`;
                    const card = document.createElement('a');
                    card.href = `#phim/${item.slug}`;
                    card.className = "movie-card bg-dark-900 rounded-xl overflow-hidden border border-dark-800 cursor-pointer flex flex-col";
                    card.innerHTML = `
                        <div class="relative aspect-poster bg-dark-950 overflow-hidden">
                            <img src="${thumb}" alt="${item.name}" loading="lazy" class="w-full h-full object-cover">
                            <span class="absolute top-2 left-2 bg-primary text-white text-[10px] font-bold px-2 py-0.5 rounded-md shadow">
                                ${item.episode_current || item.quality || 'HD'}
                            </span>
                            <span class="absolute bottom-2 right-2 bg-dark-950/80 text-white text-[10px] px-1.5 py-0.5 rounded border border-dark-700">
                                ${item.year || ''}
                            </span>
                        </div>
                        <div class="p-3 flex flex-col flex-1 justify-between">
                            <h3 class="font-bold text-xs md:text-sm line-clamp-1 text-slate-100 group-hover:text-primary">${item.name}</h3>
                            <p class="text-[11px] text-slate-400 line-clamp-1 mt-0.5">${item.origin_name || ''}</p>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                renderPagination(pagination, routeType, slug, keyword);
            } catch (err) {
                console.error("Lỗi khi tải danh sách:", err);
            } finally {
                toggleLoading(false);
            }
        }

        // ========== PAGINATION WITH HASH ==========
        function renderPagination(pagination, routeType, slug, keyword) {
            const container = document.getElementById('pagination');
            container.innerHTML = '';
            if (!pagination) return;

            const totalPages = Math.ceil(pagination.totalItems / pagination.totalItemsPerPage) || 1;
            const currentPage = pagination.currentPage || 1;
            if (totalPages <= 1) return;

            const makeUrl = (p) => {
                if (routeType === 'tim-kiem') return `#tim-kiem?keyword=${encodeURIComponent(keyword)}&page=${p}`;
                return `#${routeType}/${slug}?page=${p}`;
            };

            const prevBtn = document.createElement('a');
            prevBtn.href = currentPage > 1 ? makeUrl(currentPage - 1) : '#';
            prevBtn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold bg-dark-800 ${currentPage <= 1 ? 'opacity-40 pointer-events-none' : 'hover:bg-dark-700'}`;
            prevBtn.innerText = '‹ Trước';

            const nextBtn = document.createElement('a');
            nextBtn.href = currentPage < totalPages ? makeUrl(currentPage + 1) : '#';
            nextBtn.className = `px-3 py-1.5 rounded-lg text-xs font-semibold bg-dark-800 ${currentPage >= totalPages ? 'opacity-40 pointer-events-none' : 'hover:bg-dark-700'}`;
            nextBtn.innerText = 'Sau ›';

            const label = document.createElement('span');
            label.className = "text-xs text-slate-400 px-2 font-medium";
            label.innerText = `${currentPage} / ${totalPages}`;

            container.appendChild(prevBtn);
            container.appendChild(label);
            container.appendChild(nextBtn);
        }

        // ========== LOAD MOVIE DETAIL ==========
        async function loadMovieDetail(slug) {
            try {
                const res = await fetch(`${API_BASE}/phim/${slug}`).then(r => r.json());
                if (!res || !res.status) return;

                const movie = res.data.item;
                currentEpisodesData = movie.episodes || [];

                // Fill Info
                const poster = movie.poster_url || movie.thumb_url;
                document.getElementById('detailPoster').src = poster?.startsWith('http') ? poster : `${CDN_IMAGE}${poster}`;
                document.getElementById('detailTitle').innerText = movie.name;
                document.getElementById('detailSubTitle').innerText = `${movie.origin_name} (${movie.year})`;
                document.getElementById('detailQuality').innerText = movie.quality || 'HD';
                document.getElementById('detailLang').innerText = movie.lang || 'Vietsub';
                document.getElementById('detailYear').innerText = movie.year || '2025';
                document.getElementById('detailTime').innerText = movie.time || 'Đang cập nhật';
                document.getElementById('detailDesc').innerText = movie.content?.replace(/<[^>]*>?/gm, '') || 'Chưa có mô tả.';
                
                document.getElementById('detailDirector').innerText = Array.isArray(movie.director) ? movie.director.join(', ') : (movie.director || 'Đang cập nhật');
                document.getElementById('detailCast').innerText = Array.isArray(movie.actor) ? movie.actor.join(', ') : (movie.actor || 'Đang cập nhật');

                // Genres tags
                const genresContainer = document.getElementById('detailGenres');
                genresContainer.innerHTML = '';
                (movie.category || []).forEach(g => {
                    genresContainer.innerHTML += `<a href="#the-loai/${g.slug}?page=1" class="text-primary hover:underline">${g.name}</a>, `;
                });

                // Country tags
                const countriesContainer = document.getElementById('detailCountries');
                countriesContainer.innerHTML = '';
                (movie.country || []).forEach(c => {
                    countriesContainer.innerHTML += `<a href="#quoc-gia/${c.slug}?page=1" class="text-primary hover:underline">${c.name}</a>, `;
                });

                // Reset Player state
                document.getElementById('playerContainer').classList.add('hidden');

                // Render Server & Episode picker
                renderEpisodePicker(currentEpisodesData);

            } catch (err) {
                console.error("Lỗi khi tải chi tiết phim:", err);
            }
        }

        // ========== EPISODE PICKER & PLAYER START ==========
        function renderEpisodePicker(episodes) {
            const serverList = document.getElementById('serverList');
            const episodeList = document.getElementById('episodeList');
            serverList.innerHTML = '';
            episodeList.innerHTML = '';

            if (!episodes || episodes.length === 0) {
                episodeList.innerHTML = `<p class="text-xs text-slate-400">Phim chưa có tập phát sóng.</p>`;
                return;
            }

            const loadServerEpisodes = (serverIdx) => {
                // Highlighting server button
                Array.from(serverList.children).forEach((btn, idx) => {
                    btn.className = `server-btn px-3 py-1.5 rounded-lg text-xs font-semibold transition ${idx === serverIdx ? 'active' : 'bg-dark-800 text-slate-300 hover:bg-dark-700'}`;
                });

                episodeList.innerHTML = '';
                const epData = episodes[serverIdx].server_data || [];

                epData.forEach((ep) => {
                    const epBtn = document.createElement('button');
                    epBtn.className = `episode-btn px-3.5 py-1.5 bg-dark-800 text-slate-200 hover:bg-dark-700 rounded-lg text-xs font-medium transition`;
                    epBtn.innerText = ep.name;
                    epBtn.onclick = () => {
                        // Highlight active ep
                        Array.from(episodeList.children).forEach(b => b.classList.remove('active'));
                        epBtn.classList.add('active');
                        
                        // START VIDEO PLAY
                        playVideo(ep.link_m3u8, ep.name);
                    };
                    episodeList.appendChild(epBtn);
                });
            };

            // Render Server Buttons
            episodes.forEach((serv, idx) => {
                const servBtn = document.createElement('button');
                servBtn.innerText = serv.server_name;
                servBtn.onclick = () => loadServerEpisodes(idx);
                serverList.appendChild(servBtn);
            });

            // Init first server
            loadServerEpisodes(0);
        }

        // ========== HLS VIDEO PLAYER ==========
        function playVideo(m3u8Url, epName) {
            const playerContainer = document.getElementById('playerContainer');
            playerContainer.classList.remove('hidden');
            document.getElementById('currentEpName').innerText = epName;

            // Scroll smoothly to player
            playerContainer.scrollIntoView({ behavior: 'smooth', block: 'center' });

            const video = document.getElementById('videoPlayer');

            if (hlsPlayer) {
                hlsPlayer.destroy();
            }

            if (Hls.isSupported()) {
                hlsPlayer = new Hls();
                hlsPlayer.loadSource(m3u8Url);
                hlsPlayer.attachMedia(video);
                hlsPlayer.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(() => {});
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = m3u8Url;
                video.addEventListener('loadedmetadata', () => {
                    video.play().catch(() => {});
                });
            }
        }

        function stopVideo() {
            const video = document.getElementById('videoPlayer');
            if (video) video.pause();
            if (hlsPlayer) {
                hlsPlayer.destroy();
                hlsPlayer = null;
            }
        }

        // ========== HELPER SEARCH & UI ==========
        function handleSearch(e) {
            e.preventDefault();
            const input = document.getElementById('searchInputDesktop').value.trim() || document.getElementById('searchInputMobile').value.trim();
            if (input) {
                window.location.hash = `#tim-kiem?keyword=${encodeURIComponent(input)}&page=1`;
            }
        }

        function toggleLoading(show) {
            document.getElementById('loadingSkeleton').classList.toggle('hidden', !show);
            document.getElementById('movieGrid').classList.toggle('hidden', show);
        }
    </script>
</body>
</html>
